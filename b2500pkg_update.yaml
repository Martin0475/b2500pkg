command_line:
  - sensor:
      name: B2500PKG Installierte Version
      unique_id: b2500pkg_installierte_version
      icon: mdi:package-variant-closed-check
      command: >-
        if [ -f "/config/packages/b2500pkg/b2500pkg_manifest.json" ]; then
          cat "/config/packages/b2500pkg/b2500pkg_manifest.json";
        else
          printf '{"version":"unbekannt"}';
        fi
      value_template: >-
        {{ value_json.version | default('unbekannt') }}
      scan_interval: 86400


shell_command:
  run_custom_command: '/bin/bash -c "{{ command }}"'

lovelace:
  dashboards:
    b2500pkg-dashboard:
      mode: yaml
      title: B2500PKG
      icon: mdi:view-dashboard
      show_in_sidebar: true
      filename: dashboards/b2500pkg_dashboard.yaml


script:
  b2500pkg_update:
    alias: B2500PKG Update
    description: >-
      Lädt zuerst alle im Manifest definierten B2500PKG-Dateien
      vollständig in temporäre Dateien. Erst wenn alle Downloads
      erfolgreich waren, werden die neuen Dateien übernommen.
      Danach wird das verwendete Manifest lokal gespeichert,
      werden veraltete Dateien aus "obsolete" gelöscht und die
      im Manifest angegebenen Home-Assistant-Aktionen ausgeführt.
    mode: single

    sequence:

      # ========================================================
      # 1. Start
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: Vorbereitung
          meldung: Update wird vorbereitet
          details: "Update starten ................... läuft"
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # Verzeichnisse sicherstellen und Reste eines vorherigen
      # abgebrochenen Updates entfernen.
      - action: shell_command.run_custom_command
        data:
          command: >-
            mkdir -p
            "/config/packages/b2500pkg"
            "/config/packages/b2500pkg/automations"
            "/config/dashboards"
            &&
            find "/config/packages/b2500pkg" "/config/dashboards"
            -type f -name '*.b2500pkg_update.tmp' -delete
        response_variable: prepare_response

      - if:
          - condition: template
            value_template: >-
              {{ prepare_response.returncode | default(1) | int(1) != 0 }}
        then:
          - event: b2500pkg_status
            event_data:
              status: FEHLER
              titel: B2500PKG Update
              untertitel: Vorbereitung
              meldung: Verzeichnisse konnten nicht vorbereitet werden
              details: "Verzeichnisse prüfen ............ FEHLER"
              append: true
              rueckmeldung: "{{ prepare_response.stderr | default('') }}"
              adresse: ""
              quelle: script.b2500pkg_update
          - stop: Vorbereitung fehlgeschlagen.

      # ========================================================
      # 2. Manifest laden
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: Vorbereitung
          meldung: Vorbereitung abgeschlossen
          details: "Verzeichnisse prüfen ............ OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: Manifest
          meldung: Update-Informationen werden geladen
          details: "Manifest laden .................. läuft"
          append: true
          rueckmeldung: ""
          adresse: >-
            https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json
          quelle: script.b2500pkg_update

      - action: shell_command.run_custom_command
        data:
          command: >-
            wget -q --timeout=15 --tries=1 -O -
            "https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json?ts={{ now().timestamp() | int }}"
        response_variable: manifest_response

      - variables:
          manifest_returncode: >-
            {{ manifest_response.returncode | default(1) | int(1) }}

          manifest: >-
            {% if manifest_response.returncode | default(1) | int(1) == 0 %}
              {{ manifest_response.stdout | default('') | from_json(none) }}
            {% else %}
              {{ none }}
            {% endif %}

      - variables:
          manifest_ok: >-
            {{
              manifest_returncode == 0
              and manifest is mapping
              and (manifest.get('version', '') | string | trim) != ''
            }}

          version: >-
            {{ manifest.get('version', 'unbekannt') if manifest is mapping else 'unbekannt' }}

          changes: >-
            {{ manifest.get('changes', '') if manifest is mapping else '' }}

          files_b2500pkg: >-
            {{ manifest.get('b2500pkg', []) if manifest is mapping else [] }}

          files_automations: >-
            {{ manifest.get('automations', []) if manifest is mapping else [] }}

          files_dashboards: >-
            {{ manifest.get('dashboards', []) if manifest is mapping else [] }}

          files_install_if_missing: >-
            {{ manifest.get('install_if_missing', []) if manifest is mapping else [] }}

          files_obsolete: >-
            {{ manifest.get('obsolete', []) if manifest is mapping else [] }}

          reload_info: >-
            {{ manifest.get('reload', []) if manifest is mapping else [] }}

      - if:
          - condition: template
            value_template: "{{ not manifest_ok }}"
        then:
          - event: b2500pkg_status
            event_data:
              status: FEHLER
              titel: B2500PKG Update
              untertitel: Manifest
              meldung: Update-Informationen konnten nicht geladen werden
              details: "Manifest laden .................. FEHLER"
              append: true
              rueckmeldung: >-
                wget Returncode={{ manifest_returncode }};
                JSON gültig={{ 'JA' if manifest is mapping else 'NEIN' }};
                Version erkannt={{ 'JA' if manifest is mapping and (manifest.get('version', '') | string | trim) != '' else 'NEIN' }};
                {{ manifest_response.stderr | default('') }}
              adresse: >-
                https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json
              quelle: script.b2500pkg_update
          - stop: Manifest konnte nicht geladen werden.

      # Listen-Grundprüfung
      - if:
          - condition: template
            value_template: >-
              {{
                files_b2500pkg is string
                or files_b2500pkg is not iterable
                or files_automations is string
                or files_automations is not iterable
                or files_dashboards is string
                or files_dashboards is not iterable
                or files_install_if_missing is string
                or files_install_if_missing is not iterable
                or files_obsolete is string
                or files_obsolete is not iterable
                or reload_info is string
                or reload_info is not iterable
              }}
        then:
          - event: b2500pkg_status
            event_data:
              status: FEHLER
              titel: B2500PKG Update
              untertitel: Manifest
              meldung: Ungültige Dateiliste im Manifest
              details: "Manifest-Dateilisten ............. FEHLER"
              append: true
              rueckmeldung: ""
              adresse: ""
              quelle: script.b2500pkg_update
          - stop: Ungültige Dateiliste im Manifest.

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Manifest erfolgreich geladen
          details: "Manifest laden .................. OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Manifest geprüft
          details: "Manifest-Dateilisten ............ OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Update-Informationen
          details: "Version ......................... {{ version }}"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Update-Informationen
          details: "Änderungen ...................... {{ changes if changes else '-' }}"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # ========================================================
      # 3. ALLE Dateien zuerst als Temp-Dateien laden
      # ========================================================

      # --------------------------------------------------------
      # 3a. Dateien direkt in /config/packages/b2500pkg
      # --------------------------------------------------------
      - repeat:
          for_each: "{{ files_b2500pkg }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
                current_file_ok: >-
                  {{
                    current_file != ''
                    and current_file.endswith('.yaml')
                    and '/' not in current_file
                    and '\\' not in current_file
                    and '..' not in current_file
                    and "'" not in current_file
                    and '"' not in current_file
                  }}

            - if:
                - condition: template
                  value_template: "{{ not current_file_ok }}"
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Ungültiger Dateiname im Manifest
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: ""
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Ungültiger Dateiname im Manifest.
            - action: shell_command.run_custom_command
              data:
                command: >-
                  wget -q --timeout=15 --tries=1
                  -O "/config/packages/b2500pkg/{{ current_file }}.b2500pkg_update.tmp"
                  "https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/{{ current_file }}"
              response_variable: download_response

            - if:
                - condition: template
                  value_template: >-
                    {{ download_response.returncode | default(1) | int(1) != 0 }}
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Download fehlgeschlagen
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: "{{ download_response.stderr | default('') }}"
                    adresse: >-
                      https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/{{ current_file }}
                    quelle: script.b2500pkg_update
                - stop: Download fehlgeschlagen.

            - event: b2500pkg_status
              event_data:
                status: LAEUFT
                titel: B2500PKG Update
                untertitel: "GitHub-Version {{ version }}"
                meldung: Dateien werden zwischengespeichert
                details: "Lade {{ current_file }} ........ OK"
                append: true
                rueckmeldung: ""
                adresse: ""
                quelle: script.b2500pkg_update

      # --------------------------------------------------------
      # 3b. Automationen
      # --------------------------------------------------------
      - repeat:
          for_each: "{{ files_automations }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
                current_file_ok: >-
                  {{
                    current_file != ''
                    and current_file.endswith('.yaml')
                    and '/' not in current_file
                    and '\\' not in current_file
                    and '..' not in current_file
                    and "'" not in current_file
                    and '"' not in current_file
                  }}

            - if:
                - condition: template
                  value_template: "{{ not current_file_ok }}"
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Ungültiger Dateiname im Manifest
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: ""
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Ungültiger Dateiname im Manifest.
            - action: shell_command.run_custom_command
              data:
                command: >-
                  wget -q --timeout=15 --tries=1
                  -O "/config/packages/b2500pkg/automations/{{ current_file }}.b2500pkg_update.tmp"
                  "https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/automations/{{ current_file }}"
              response_variable: download_response

            - if:
                - condition: template
                  value_template: >-
                    {{ download_response.returncode | default(1) | int(1) != 0 }}
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Download fehlgeschlagen
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: "{{ download_response.stderr | default('') }}"
                    adresse: >-
                      https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/automations/{{ current_file }}
                    quelle: script.b2500pkg_update
                - stop: Download fehlgeschlagen.

            - event: b2500pkg_status
              event_data:
                status: LAEUFT
                titel: B2500PKG Update
                untertitel: "GitHub-Version {{ version }}"
                meldung: Dateien werden zwischengespeichert
                details: "Lade {{ current_file }} ........ OK"
                append: true
                rueckmeldung: ""
                adresse: ""
                quelle: script.b2500pkg_update

      # --------------------------------------------------------
      # 3c. Dashboard-Dateien
      # --------------------------------------------------------
      - repeat:
          for_each: "{{ files_dashboards }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
                current_file_ok: >-
                  {{
                    current_file != ''
                    and current_file.endswith('.yaml')
                    and '/' not in current_file
                    and '\\' not in current_file
                    and '..' not in current_file
                    and "'" not in current_file
                    and '"' not in current_file
                  }}

            - if:
                - condition: template
                  value_template: "{{ not current_file_ok }}"
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Ungültiger Dateiname im Manifest
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: ""
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Ungültiger Dateiname im Manifest.
            - action: shell_command.run_custom_command
              data:
                command: >-
                  wget -q --timeout=15 --tries=1
                  -O "/config/dashboards/{{ current_file }}.b2500pkg_update.tmp"
                  "https://raw.githubusercontent.com/Martin0475/b2500pkg/main/dashboards/{{ current_file }}"
              response_variable: download_response

            - if:
                - condition: template
                  value_template: >-
                    {{ download_response.returncode | default(1) | int(1) != 0 }}
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Download fehlgeschlagen
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: "{{ download_response.stderr | default('') }}"
                    adresse: >-
                      https://raw.githubusercontent.com/Martin0475/b2500pkg/main/dashboards/{{ current_file }}
                    quelle: script.b2500pkg_update
                - stop: Download fehlgeschlagen.

            - event: b2500pkg_status
              event_data:
                status: LAEUFT
                titel: B2500PKG Update
                untertitel: "GitHub-Version {{ version }}"
                meldung: Dateien werden zwischengespeichert
                details: "Lade {{ current_file }} ........ OK"
                append: true
                rueckmeldung: ""
                adresse: ""
                quelle: script.b2500pkg_update

      # --------------------------------------------------------
      # 3d. install_if_missing
      # z.B. basic_settings.yaml:
      # nur laden, wenn Zieldatei noch nicht vorhanden ist.
      # --------------------------------------------------------
      - repeat:
          for_each: "{{ files_install_if_missing }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
                current_file_ok: >-
                  {{
                    current_file != ''
                    and current_file.endswith('.yaml')
                    and '/' not in current_file
                    and '\\' not in current_file
                    and '..' not in current_file
                    and "'" not in current_file
                    and '"' not in current_file
                  }}

            - if:
                - condition: template
                  value_template: "{{ not current_file_ok }}"
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Ungültiger Dateiname im Manifest
                    details: "Prüfe {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: ""
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Ungültiger Dateiname im Manifest.

            - action: shell_command.run_custom_command
              data:
                command: >-
                  target="/config/packages/b2500pkg/{{ current_file }}";
                  tmp="${target}.b2500pkg_update.tmp";
                  if [ -f "$target" ]; then
                    printf 'VORHANDEN';
                    exit 0;
                  fi;
                  wget -q --timeout=15 --tries=1
                  -O "$tmp"
                  "https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/{{ current_file }}"
              response_variable: missing_response

            - if:
                - condition: template
                  value_template: >-
                    {{ missing_response.returncode | default(1) | int(1) != 0 }}
              then:
                - action: shell_command.run_custom_command
                  data:
                    command: >-
                      find "/config/packages/b2500pkg" "/config/dashboards"
                      -type f -name '*.b2500pkg_update.tmp' -delete
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Download fehlgeschlagen
                    details: "Lade {{ current_file }} ........ FEHLER"
                    append: true
                    rueckmeldung: "{{ missing_response.stderr | default('') }}"
                    adresse: >-
                      https://raw.githubusercontent.com/Martin0475/b2500pkg/main/packages/b2500pkg/{{ current_file }}
                    quelle: script.b2500pkg_update
                - stop: Download fehlgeschlagen.

            - event: b2500pkg_status
              event_data:
                status: LAEUFT
                titel: B2500PKG Update
                untertitel: "GitHub-Version {{ version }}"
                meldung: Dateien werden zwischengespeichert
                details: >-
                  {% if 'VORHANDEN' in (missing_response.stdout | default('')) %}
                    {{ current_file }} ........ VORHANDEN
                  {% else %}
                    Lade {{ current_file }} ........ OK
                  {% endif %}
                append: true
                rueckmeldung: ""
                adresse: ""
                quelle: script.b2500pkg_update

      # ========================================================
      # 4. Alle Downloads waren erfolgreich
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Neue Dateien werden übernommen
          details: "Alle Downloads ................... OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # Anzahl der tatsächlich vorbereiteten Dateien ermitteln.
      # install_if_missing-Dateien, die bereits vorhanden sind,
      # besitzen keine Temp-Datei und werden daher nicht mitgezählt.
      - action: shell_command.run_custom_command
        data:
          command: >-
            find "/config/packages/b2500pkg" "/config/dashboards"
            -type f -name '*.b2500pkg_update.tmp' | wc -l
        response_variable: prepared_count_response

      - variables:
          prepared_count: >-
            {{ prepared_count_response.stdout | default('0') | trim | int(0) }}

      # ========================================================
      # 5. Vorbereitete Dateien übernehmen
      #    Vorhandene gleichnamige Dateien werden hier ersetzt.
      # ========================================================

      # 5a. b2500pkg
      - repeat:
          for_each: "{{ files_b2500pkg }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
            - action: shell_command.run_custom_command
              data:
                command: >-
                  mv
                  "/config/packages/b2500pkg/{{ current_file }}.b2500pkg_update.tmp"
                  "/config/packages/b2500pkg/{{ current_file }}"
              response_variable: activate_response
            - if:
                - condition: template
                  value_template: >-
                    {{ activate_response.returncode | default(1) | int(1) != 0 }}
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Datei konnte nicht übernommen werden
                    details: "Übernehme {{ current_file }} .... FEHLER"
                    append: true
                    rueckmeldung: "{{ activate_response.stderr | default('') }}"
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Übernehmen einer Datei fehlgeschlagen.
      # 5b. Automationen
      - repeat:
          for_each: "{{ files_automations }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
            - action: shell_command.run_custom_command
              data:
                command: >-
                  mv
                  "/config/packages/b2500pkg/automations/{{ current_file }}.b2500pkg_update.tmp"
                  "/config/packages/b2500pkg/automations/{{ current_file }}"
              response_variable: activate_response
            - if:
                - condition: template
                  value_template: >-
                    {{ activate_response.returncode | default(1) | int(1) != 0 }}
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Datei konnte nicht übernommen werden
                    details: "Übernehme {{ current_file }} .... FEHLER"
                    append: true
                    rueckmeldung: "{{ activate_response.stderr | default('') }}"
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Übernehmen einer Datei fehlgeschlagen.
      # 5c. Dashboards
      - repeat:
          for_each: "{{ files_dashboards }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
            - action: shell_command.run_custom_command
              data:
                command: >-
                  mv
                  "/config/dashboards/{{ current_file }}.b2500pkg_update.tmp"
                  "/config/dashboards/{{ current_file }}"
              response_variable: activate_response
            - if:
                - condition: template
                  value_template: >-
                    {{ activate_response.returncode | default(1) | int(1) != 0 }}
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Datei konnte nicht übernommen werden
                    details: "Übernehme {{ current_file }} .... FEHLER"
                    append: true
                    rueckmeldung: "{{ activate_response.stderr | default('') }}"
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Übernehmen einer Datei fehlgeschlagen.
      # 5d. install_if_missing
      # Wenn kein Temp existiert, war die Datei bereits vorhanden.
      - repeat:
          for_each: "{{ files_install_if_missing }}"
          sequence:
            - variables:
                current_file: "{{ repeat.item | string | trim }}"
            - action: shell_command.run_custom_command
              data:
                command: >-
                  tmp="/config/packages/b2500pkg/{{ current_file }}.b2500pkg_update.tmp";
                  target="/config/packages/b2500pkg/{{ current_file }}";
                  if [ -f "$tmp" ]; then
                    mv "$tmp" "$target";
                  fi
              response_variable: activate_response
            - if:
                - condition: template
                  value_template: >-
                    {{ activate_response.returncode | default(1) | int(1) != 0 }}
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Datei konnte nicht übernommen werden
                    details: "Übernehme {{ current_file }} .... FEHLER"
                    append: true
                    rueckmeldung: "{{ activate_response.stderr | default('') }}"
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Übernehmen einer Datei fehlgeschlagen.
      # ========================================================
      # 6. Installiertes Manifest lokal speichern
      #
      # Erst nachdem alle neuen Dateien erfolgreich übernommen
      # wurden, wird das GitHub-Manifest als lokale Kopie abgelegt.
      # Ziel:
      #   /config/packages/b2500pkg/b2500pkg_manifest.json
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Dateien wurden übernommen
          details: "Neue Dateien übernehmen .......... OK ({{ prepared_count }})"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Installations-Manifest wird gespeichert
          details: "Manifest speichern ............... läuft"
          append: true
          rueckmeldung: ""
          adresse: >-
            https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json
          quelle: script.b2500pkg_update

      - action: shell_command.run_custom_command
        data:
          command: >-
            tmp="/config/packages/b2500pkg/b2500pkg_manifest.json.b2500pkg_update.tmp";
            target="/config/packages/b2500pkg/b2500pkg_manifest.json";
            url="https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json?ts={{ now().timestamp() | int }}";
            if wget -q --timeout=15 --tries=1 -O "$tmp" "$url"; then
              mv "$tmp" "$target";
            else
              rc=$?;
              rm -f "$tmp";
              exit "$rc";
            fi
        response_variable: manifest_save_response

      - if:
          - condition: template
            value_template: >-
              {{ manifest_save_response.returncode | default(1) | int(1) != 0 }}
        then:
          - event: b2500pkg_status
            event_data:
              status: FEHLER
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Installations-Manifest konnte nicht gespeichert werden
              details: "Manifest speichern ............... FEHLER"
              append: true
              rueckmeldung: "{{ manifest_save_response.stderr | default('') }}"
              adresse: >-
                https://raw.githubusercontent.com/Martin0475/b2500pkg/main/install_scripts/b2500pkg_manifest.json
              quelle: script.b2500pkg_update
          - stop: Installations-Manifest konnte nicht gespeichert werden.

      # Installierte Version sofort neu einlesen.
      # Beim erstmaligen Einbau existiert der command_line-Sensor
      # ggf. erst nach einem Home-Assistant-Neustart; deshalb darf
      # ein Fehler hier das Update nicht abbrechen.
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.b2500pkg_installierte_version
        continue_on_error: true

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Veraltete Dateien werden entfernt
          details: "Manifest speichern ............... OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # ========================================================
      # 7. Veraltete Dateien ERST JETZT löschen
      # ========================================================
      - repeat:
          for_each: "{{ files_obsolete }}"
          sequence:
            - variables:
                obsolete_file: "{{ repeat.item | string | trim }}"
                obsolete_ok: >-
                  {{
                    obsolete_file != ''
                    and obsolete_file.endswith('.yaml')
                    and '..' not in obsolete_file
                    and "'" not in obsolete_file
                    and '"' not in obsolete_file
                    and (
                      obsolete_file.startswith('/config/packages/b2500pkg/')
                      or obsolete_file.startswith('/config/dashboards/')
                    )
                  }}

            - if:
                - condition: template
                  value_template: "{{ not obsolete_ok }}"
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Ungültiger obsolete-Pfad im Manifest
                    details: "Lösche {{ obsolete_file }} .... FEHLER"
                    append: true
                    rueckmeldung: ""
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Ungültiger obsolete-Pfad im Manifest.
            - action: shell_command.run_custom_command
              data:
                command: >-
                  rm -f "{{ obsolete_file }}"
              response_variable: obsolete_response

            - if:
                - condition: template
                  value_template: >-
                    {{ obsolete_response.returncode | default(1) | int(1) != 0 }}
              then:
                - event: b2500pkg_status
                  event_data:
                    status: FEHLER
                    titel: B2500PKG Update
                    untertitel: "GitHub-Version {{ version }}"
                    meldung: Veraltete Datei konnte nicht gelöscht werden
                    details: "Lösche {{ obsolete_file }} .... FEHLER"
                    append: true
                    rueckmeldung: "{{ obsolete_response.stderr | default('') }}"
                    adresse: ""
                    quelle: script.b2500pkg_update
                - stop: Löschen einer veralteten Datei fehlgeschlagen.
      # ========================================================

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Veraltete Dateien wurden entfernt
          details: "Veraltete Dateien löschen ........ OK ({{ files_obsolete | count }})"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # 8. Aufräumen
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Temporäre Dateien werden bereinigt
          details: "Temporäre Dateien löschen ........ läuft"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - action: shell_command.run_custom_command
        data:
          command: >-
            find "/config/packages/b2500pkg" "/config/dashboards"
            -type f -name '*.b2500pkg_update.tmp' -delete
        response_variable: cleanup_response

      - if:
          - condition: template
            value_template: >-
              {{ cleanup_response.returncode | default(1) | int(1) != 0 }}
        then:
          - event: b2500pkg_status
            event_data:
              status: FEHLER
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Temporäre Dateien konnten nicht gelöscht werden
              details: "Temporäre Dateien löschen ........ FEHLER"
              append: true
              rueckmeldung: "{{ cleanup_response.stderr | default('') }}"
              adresse: ""
              quelle: script.b2500pkg_update
          - stop: Aufräumen fehlgeschlagen.

      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Temporäre Dateien wurden bereinigt
          details: "Temporäre Dateien löschen ........ OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      # ========================================================
      # 9. Home-Assistant-Aktionen aus dem Manifest
      #
      # Vollständige Home-Assistant-Action-Namen verwenden:
      #
      #   "reload": [
      #     "input_number.reload",
      #     "input_text.reload",
      #     "automation.reload",
      #     "script.reload"
      #   ]
      #
      # oder:
      #   "reload": ["homeassistant.reload_all"]
      #
      # homeassistant.reload_all hat Vorrang. script.reload läuft
      # immer zuletzt. Beide können das laufende Update-Script
      # beenden, daher wird der Abschlussstatus vorher gepostet.
      #
      # Auch andere zukünftige parameterlose Actions im Format
      # domain.action können direkt eingetragen werden.
      # ========================================================
      - variables:
          action_names: >-
            {{ reload_info | map('string') | map('lower') | map('trim') | list }}

          reload_all_requested: >-
            {{ 'homeassistant.reload_all' in action_names }}

          script_reload_requested: >-
            {{ 'script.reload' in action_names }}

      # --------------------------------------------------------
      # 9a. Normale Actions
      # --------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ not reload_all_requested }}"
        then:
          - repeat:
              for_each: "{{ action_names }}"
              sequence:
                - variables:
                    current_action: "{{ repeat.item }}"

                - if:
                    - condition: template
                      value_template: >-
                        {{
                          current_action not in
                          ['', 'script.reload', 'homeassistant.reload_all']
                        }}
                  then:
                    - if:
                        - condition: template
                          value_template: >-
                            {{
                              '.' not in current_action
                              or current_action.startswith('.')
                              or current_action.endswith('.')
                            }}
                      then:
                        - event: b2500pkg_status
                          event_data:
                            status: FEHLER
                            titel: B2500PKG Update
                            untertitel: "GitHub-Version {{ version }}"
                            meldung: Ungültiger Home-Assistant-Action-Name
                            details: "Action {{ current_action }} .... FEHLER"
                            append: true
                            rueckmeldung: "Erwartet wird domain.action."
                            adresse: "{{ current_action }}"
                            quelle: script.b2500pkg_update
                        - stop: Ungültiger Home-Assistant-Action-Name.

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Update
                        untertitel: "GitHub-Version {{ version }}"
                        meldung: Home-Assistant-Aktion wird ausgeführt
                        details: "Action {{ current_action }} .... läuft"
                        append: true
                        rueckmeldung: ""
                        adresse: "{{ current_action }}"
                        quelle: script.b2500pkg_update

                    - action: "{{ current_action }}"

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Update
                        untertitel: "GitHub-Version {{ version }}"
                        meldung: Home-Assistant-Aktion wurde ausgeführt
                        details: "Action {{ current_action }} .... OK"
                        append: true
                        rueckmeldung: ""
                        adresse: "{{ current_action }}"
                        quelle: script.b2500pkg_update

      # --------------------------------------------------------
      # 9b. homeassistant.reload_all
      # --------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ reload_all_requested }}"
        then:
          - event: b2500pkg_status
            event_data:
              status: ERFOLGREICH
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Update abgeschlossen – Home Assistant wird neu geladen
              details: "Update abgeschlossen ............. OK"
              append: true
              rueckmeldung: ""
              adresse: ""
              quelle: script.b2500pkg_update

          - event: b2500pkg_status
            event_data:
              status: ERFOLGREICH
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Update abgeschlossen
              details: "Action homeassistant.reload_all ... startet"
              append: true
              rueckmeldung: ""
              adresse: homeassistant.reload_all
              quelle: script.b2500pkg_update

          - action: homeassistant.reload_all

          - stop: homeassistant.reload_all ausgelöst.

      # --------------------------------------------------------
      # 9c. script.reload
      # --------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ script_reload_requested }}"
        then:
          - event: b2500pkg_status
            event_data:
              status: ERFOLGREICH
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Update abgeschlossen – Scripts werden neu geladen
              details: "Update abgeschlossen ............. OK"
              append: true
              rueckmeldung: ""
              adresse: ""
              quelle: script.b2500pkg_update

          - event: b2500pkg_status
            event_data:
              status: ERFOLGREICH
              titel: B2500PKG Update
              untertitel: "GitHub-Version {{ version }}"
              meldung: Update abgeschlossen
              details: "Action script.reload .............. startet"
              append: true
              rueckmeldung: ""
              adresse: script.reload
              quelle: script.b2500pkg_update

          - action: script.reload

          - stop: script.reload ausgelöst.

      # ========================================================
      # 10. Abschluss ohne script.reload / reload_all
      # ========================================================
      - event: b2500pkg_status
        event_data:
          status: ERFOLGREICH
          titel: B2500PKG Update
          untertitel: "GitHub-Version {{ version }}"
          meldung: Dateien erfolgreich aktualisiert
          details: "Update abgeschlossen ............. OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_update

      - variables:
          response:
            success: true
            code: FILE_UPDATE_OK
            message: Dateien erfolgreich aktualisiert.
            version: "{{ version }}"
            changes: "{{ changes }}"
            b2500pkg_count: "{{ files_b2500pkg | count }}"
            automations_count: "{{ files_automations | count }}"
            dashboards_count: "{{ files_dashboards | count }}"
            install_if_missing_count: "{{ files_install_if_missing | count }}"
            obsolete_count: "{{ files_obsolete | count }}"
            reload_count: "{{ reload_info | count }}"

      - stop: Dateien erfolgreich aktualisiert.
        response_variable: response
