input_number:
  b2500_01_status:
    name: B2500_01 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_02_status:
    name: B2500_02 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_03_status:
    name: B2500_03 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_04_status:
    name: B2500_04 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_05_status:
    name: B2500_05 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_06_status:
    name: B2500_06 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_07_status:
    name: B2500_07 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_08_status:
    name: B2500_08 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

  b2500_09_status:
    name: B2500_09 Status
    min: -1
    max: 4
    step: 1
    mode: box
    initial: 0

# ============================================================
# Recorder
#
# Worker-Status und Worker-Script-Zustaende sind rein transient
# und werden nicht fuer Langzeitstatistiken benoetigt.
# ============================================================


script:
  b2500_01_worker:
    alias: B2500PKG_B01_Worker
    mode: queued
    max: 50

    trace:
      stored_traces: 0
    fields:
      payload:
        required: true
        selector:
          text:
      followup_payload:
        required: false
        default: ""
        selector:
          text:
      no_check:
        required: false
        default: false
        selector:
          boolean:
      expected_answer:
        required: false
        default: {}
        selector:
          object:

    sequence:
      - variables:
          mqtt_topic: "{{ states('input_text.b01_topic') }}/{{ states('input_text.b01_typ') }}/App/{{ states('input_text.b01_mac') }}/ctrl"
          mqtt_mac: "{{ states('input_text.b01_mac') }}"
          payload_clean: "{{ payload | default('', true) | string | trim }}"
          followup_payload_clean: "{{ followup_payload | default('', true) | string | trim }}"
          no_check_clean: "{{ no_check | default(false) }}"
          expected_answer_clean: >-
            {% if expected_answer is defined and expected_answer is mapping %}
              {{ expected_answer }}
            {% else %}
              {{ {} }}
            {% endif %}
          wait_command: "{{ followup_payload_clean if followup_payload_clean != '' else payload_clean }}"

          # Das Repost-Dictionary ist die technische Wahrheit fuer die
          # Bestaetigung. Die Discovery-Entitaeten koennen Werte fuer die UI
          # uebersetzen (z. B. cs), werden vom Worker aber nicht mehr gelesen.
          cache_entity: sensor.b2500_cache_01
          cache_key: >-
            {% if wait_command == 'cd=01' %}
              cd01
            {% elif wait_command == 'cd=13' %}
              cd13
            {% elif wait_command == 'cd=15' %}
              cd15
            {% elif wait_command == 'cd=16' %}
              cd16
            {% elif wait_command == 'cd=21' %}
              cd21
            {% elif wait_command == 'cd=24' %}
              cd24
            {% else %}
              cd01
            {% endif %}
          wait_topic: "B2500PKG/B2500_01/{{ cache_key | upper }}/last_updated"

      - if:
          - condition: template
            value_template: '{{ payload_clean == "" }}'
        then:
          - stop: "Kein payload → Abbruch"

      - if:
          - condition: template
            value_template: '{{ mqtt_mac in ["", "unknown", "unavailable", "none", None] }}'
        then:
          - stop: "MAC ungültig → Abbruch"

      - if:
          - condition: template
            value_template: >-
              {{ expected_answer is defined
                 and expected_answer is not mapping }}
        then:
          - stop: "expected_answer ist kein Dictionary → Abbruch"

      - service: input_number.set_value
        target:
          entity_id: input_number.b2500_01_status
        data:
          value: 1

      - service: mqtt.publish
        data:
          topic: "{{ mqtt_topic }}"
          payload: "{{ payload_clean }}"
          qos: 1

      - if:
          - condition: template
            value_template: '{{ followup_payload_clean != "" }}'
        then:
          - delay:
              seconds: 2
          - service: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: "{{ followup_payload_clean }}"
              qos: 1

      - if:
          - condition: template
            value_template: '{{ no_check_clean == true }}'
        then:
          - delay:
              milliseconds: 500
          - service: input_number.set_value
            target:
              entity_id: input_number.b2500_01_status
            data:
              value: 4
          - stop: "no_check aktiv → gesendet, ohne Prüfung"

      - wait_for_trigger:
          - trigger: mqtt
            topic: "{{ wait_topic }}"
        timeout: "00:00:05"
        continue_on_timeout: true

      - variables:
          first_ok: >-
            {% if wait.trigger is none %}
              false
            {% else %}
              {% set data = state_attr(cache_entity, cache_key) or {} %}
              {% set ns = namespace(ok=true) %}
              {% if data is not mapping %}
                {% set ns.ok = false %}
              {% else %}
                {% for field, expected in expected_answer_clean.items() %}
                  {% set field_name = field | string | lower %}
                  {% set actual = data.get(field_name) %}
                  {% if actual is none or (actual | string | lower) in ['unknown', 'unavailable', 'none', ''] %}
                    {% set ns.ok = false %}
                  {% elif expected is number %}
                    {% if actual | float(999999999) != expected | float(999999998) %}
                      {% set ns.ok = false %}
                    {% endif %}
                  {% else %}
                    {% if actual | string != expected | string %}
                      {% set ns.ok = false %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.ok }}
            {% endif %}

      - if:
          - condition: template
            value_template: '{{ first_ok }}'
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.b2500_01_status
            data:
              value: 3
        else:
          - service: input_number.set_value
            target:
              entity_id: input_number.b2500_01_status
            data:
              value: 2

          - service: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: "{{ payload_clean }}"
              qos: 1

          - if:
              - condition: template
                value_template: '{{ followup_payload_clean != "" }}'
            then:
              - delay:
                  seconds: 2
              - service: mqtt.publish
                data:
                  topic: "{{ mqtt_topic }}"
                  payload: "{{ followup_payload_clean }}"
                  qos: 1

          - wait_for_trigger:
              - trigger: mqtt
                topic: "{{ wait_topic }}"
            timeout: "00:00:05"
            continue_on_timeout: true

          - variables:
              second_ok: >-
                {% if wait.trigger is none %}
                  false
                {% else %}
                  {% set data = state_attr(cache_entity, cache_key) or {} %}
                  {% set ns = namespace(ok=true) %}
                  {% if data is not mapping %}
                    {% set ns.ok = false %}
                  {% else %}
                    {% for field, expected in expected_answer_clean.items() %}
                      {% set field_name = field | string | lower %}
                      {% set actual = data.get(field_name) %}
                      {% if actual is none or (actual | string | lower) in ['unknown', 'unavailable', 'none', ''] %}
                        {% set ns.ok = false %}
                      {% elif expected is number %}
                        {% if actual | float(999999999) != expected | float(999999998) %}
                          {% set ns.ok = false %}
                        {% endif %}
                      {% else %}
                        {% if actual | string != expected | string %}
                          {% set ns.ok = false %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.ok }}
                {% endif %}

          - if:
              - condition: template
                value_template: '{{ second_ok }}'
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.b2500_01_status
                data:
                  value: 3
            else:
              - service: input_number.set_value
                target:
                  entity_id: input_number.b2500_01_status
                data:
                  value: -1

