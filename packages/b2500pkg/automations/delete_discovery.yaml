script:
  b2500pkg_delete_discovery:
    alias: B2500PKG_Delete_Discovery
    description: "Löscht alle retained MQTT-Discovery-Einträge des ausgewählten Speichers."
    fields:
      speicher:
        name: Speicher
        description: Speicher auswählen, dessen MQTT-Discovery-Einträge gelöscht werden sollen.
        required: true
        selector:
          select:
            options:
              - label: "B01"
                value: "01"
              - label: "B02"
                value: "02"
              - label: "B03"
                value: "03"
              - label: "B04"
                value: "04"
              - label: "B05"
                value: "05"
              - label: "B06"
                value: "06"
              - label: "B07"
                value: "07"
              - label: "B08"
                value: "08"
              - label: "B09"
                value: "09"
            mode: dropdown
    sequence:
      - variables:
          speicher_nummer: "{{ speicher }}"
          discovery_topics:
            - "homeassistant/binary_sensor/b2500_{{ speicher_nummer }}/l0_bit0/config"
            - "homeassistant/binary_sensor/b2500_{{ speicher_nummer }}/l0_bit1/config"
