input_select:
  lademodus:
    name: Lademodus auswählen
    options: 
      - "Laden vor dem Entladen"
      - "Laden und Entladen gleichzeitig"

script:
  b2500pkg_set_charging_mode:
    alias: B2500PKG_Set_Charging_Mode
    description: >
      Setzt den Lademodus für einen oder alle B2500-Speicher.
      Leere Aktionsfelder verwenden die vorhandenen Input-Helper.

    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: "b2500_01"
        selector:
          select:
            options:
              - label: "B01"
                value: "b2500_01"
              - label: "B02"
                value: "b2500_02"
              - label: "B03"
                value: "b2500_03"
              - label: "B04"
                value: "b2500_04"
              - label: "B05"
                value: "b2500_05"
              - label: "B06"
                value: "b2500_06"
              - label: "B07"
                value: "b2500_07"
              - label: "B08"
                value: "b2500_08"
              - label: "B09"
                value: "b2500_09"
              - label: "Alle Speicher"
                value: "Alle_Speicher"

      lademodus:
        name: Lademodus
        description: Optional. Wenn leer, wird input_select.lademodus verwendet.
        required: false
        example: "Laden vor dem Entladen"
        selector:
          select:
            options:
              - "Laden vor dem Entladen"
              - "Laden und Entladen gleichzeitig"

    sequence:
      - variables:
          speicher_auswahl: >-
            {% if speicher is defined and speicher | string | trim != '' %}
              {{ speicher }}
            {% else %}
              {{ states('input_select.speicherauswahl') }}
            {% endif %}

          lademodus_auswahl: >-
            {% if lademodus is defined and lademodus | string | trim != '' %}
              {{ lademodus }}
            {% else %}
              {{ states('input_select.lademodus') }}
            {% endif %}

          lademodus_value: >-
            {% if lademodus_auswahl == 'Laden vor dem Entladen' %}
              1
            {% else %}
              0
            {% endif %}

          charging_payload: >-
            cd=17,md={{ lademodus_value | int }}

          all_speicher: "{{ states('input_text.b2500_all') | from_json }}"

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: "script.{{ repeat.item }}_worker"
              data:
                variables:
                  payload: "{{ charging_payload }}"
                  followup_payload: "cd=01"
                  no_check: false
                  expected_answer:
                    cs: "{{ lademodus_auswahl }}"

            - delay:
                seconds: 1

    mode: queued
    max: 10