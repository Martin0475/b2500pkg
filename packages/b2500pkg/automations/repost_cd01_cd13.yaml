recorder:
  exclude:
    entity_globs:
      - sensor.b2500_cache_*

automation:
  alias: B2500PKG_Repost_CD01_CD13_CD15_CD16_CD21_CD24_CD30
  description: ""
  triggers:
    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: w1=
      value_template: "{{ value.split(',')[2][0:3] }}"
      id: b2500_cd01

    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: a0=
      value_template: "{{ value[0:3] }}"
      id: b2500_cd13

    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: pe=
      value_template: "{{ value[0:3] }}"
      id: b2500_cd15

    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: m1=
      value_template: "{{ value.split(',')[2][0:3] }}"
      id: b2500_cd16

    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: "cf,df"
      value_template: >-
        {% set parts = value.split(',') %}
        {% if parts | count >= 2 %}
          {{ parts[0].split('=')[0] | trim }},{{ parts[1].split('=')[0] | trim }}
        {% else %}
          unknown
        {% endif %}
      id: b2500_cd21

    - trigger: mqtt
      topic: +/+/device/+/ctrl
      payload: "id,s,c,i,p"
      value_template: >-
        {% set parts = value.split(',') %}
        {% if parts | count >= 5 %}
          {{ parts[0].split('=')[0] | trim }},{{ parts[1].split('=')[0] | trim }},{{ parts[2].split('=')[0] | trim }},{{ parts[3].split('=')[0] | trim }},{{ parts[4].split('=')[0] | trim }}
        {% else %}
          unknown
        {% endif %}
      id: b2500_cd24

    # CD30 wird über die Anfrage zugeordnet.
    # Die Antwort besteht aus binären 9-Byte-Ereigniseinträgen und
    # besitzt daher keine sichere key=value-Signatur wie CD21/CD24.
    - trigger: mqtt
      topic: +/+/App/+/ctrl
      payload: "cd=30"
      id: b2500_cd30_request

  conditions: []

  actions:
    - variables:
        device_topic: "{{ trigger.topic | replace('/App/', '/device/') }}"

        speicher_nummer: >-
          {{ 'B2500_01' if device_topic == states('input_text.b01_topic') + '/' +
          states('input_text.b01_typ') + '/device/' + states('input_text.b01_mac')
          + '/ctrl'
           else 'B2500_02' if device_topic == states('input_text.b02_topic') + '/' + states('input_text.b02_typ') + '/device/' + states('input_text.b02_mac') + '/ctrl'
           else 'B2500_03' if device_topic == states('input_text.b03_topic') + '/' + states('input_text.b03_typ') + '/device/' + states('input_text.b03_mac') + '/ctrl'
           else 'B2500_04' if device_topic == states('input_text.b04_topic') + '/' + states('input_text.b04_typ') + '/device/' + states('input_text.b04_mac') + '/ctrl'
           else 'B2500_05' if device_topic == states('input_text.b05_topic') + '/' + states('input_text.b05_typ') + '/device/' + states('input_text.b05_mac') + '/ctrl'
           else 'B2500_06' if device_topic == states('input_text.b06_topic') + '/' + states('input_text.b06_typ') + '/device/' + states('input_text.b06_mac') + '/ctrl'
           else 'B2500_07' if device_topic == states('input_text.b07_topic') + '/' + states('input_text.b07_typ') + '/device/' + states('input_text.b07_mac') + '/ctrl'
           else 'B2500_08' if device_topic == states('input_text.b08_topic') + '/' + states('input_text.b08_typ') + '/device/' + states('input_text.b08_mac') + '/ctrl'
           else 'B2500_09' if device_topic == states('input_text.b09_topic') + '/' + states('input_text.b09_typ') + '/device/' + states('input_text.b09_mac') + '/ctrl'
           else 'unknown' }}

        now_ts: "{{ now().timestamp() }}"

        # ------------------------------------------------------
        # Aktuelles Telegramm einmal in ein Dictionary zerlegen
        #
        # Beispiel:
        #   p1=1,p2=1,w1=110,pe=91
        #
        # ergibt:
        #   {
        #     "p1": "1",
        #     "p2": "1",
        #     "w1": "110",
        #     "pe": "91"
        #   }
        #
        # Alle Werte bleiben absichtlich Strings.
        # CD30 wird hier nicht geparst, da dessen Antwort kein
        # key=value-Telegramm ist.
        # ------------------------------------------------------
        current_dict: >-
          {% if trigger.id != 'b2500_cd30_request' %}
            {% set ns = namespace(items=[]) %}
            {% for part in trigger.payload.split(',') %}
              {% if '=' in part %}
                {% set kv = part.split('=', 1) %}
                {% set key = kv[0] | trim %}
                {% set value = kv[1] | trim %}
                {% if key != '' %}
                  {% set ns.items = ns.items + [(key, value)] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ dict(ns.items) }}
          {% else %}
            {{ {} }}
          {% endif %}

    # --------------------------------------------------------
    # Cache-Zuordnung für das aktuelle Telegramm
    # --------------------------------------------------------
    - variables:
        cd_cache_key: >-
          {{ 'cd01' if trigger.id == 'b2500_cd01'
             else 'cd13' if trigger.id == 'b2500_cd13'
             else 'cd15' if trigger.id == 'b2500_cd15'
             else 'cd16' if trigger.id == 'b2500_cd16'
             else 'cd21' if trigger.id == 'b2500_cd21'
             else 'cd24' if trigger.id == 'b2500_cd24'
             else '' }}

        cache_entity: >-
          {{ 'sensor.b2500_cache_' ~ speicher_nummer[-2:]
             if speicher_nummer != 'unknown'
             else '' }}

    - variables:
        cd_topic: >-
          {{ cd_cache_key | upper if cd_cache_key != '' else '' }}

    # --------------------------------------------------------
    # Letztes vollständig repostetes Dictionary lesen
    # --------------------------------------------------------
    - variables:
        old_dict: >-
          {% if cache_entity != '' and cd_cache_key != '' %}
            {{ state_attr(cache_entity, cd_cache_key) or {} }}
          {% else %}
            {{ {} }}
          {% endif %}

    # --------------------------------------------------------
    # Delta bilden:
    # nur Keys, deren Wert gegenüber old_dict neu/geändert ist.
    # Im neuen Telegramm fehlende Keys werden nicht gelöscht.
    # --------------------------------------------------------
    - variables:
        changed_dict: >-
          {% set ns = namespace(items=[]) %}
          {% for key, value in current_dict.items() %}
            {% if old_dict.get(key) != value %}
              {% set ns.items = ns.items + [(key, value)] %}
            {% endif %}
          {% endfor %}
          {{ dict(ns.items) }}

    - variables:
        changed_keys: "{{ changed_dict.keys() | list }}"
        changed_count: "{{ changed_dict | count }}"

    - if:
        - condition: template
          value_template: "{{ speicher_nummer != 'unknown' }}"
      then:

        # ----------------------------------------------------
        # Nur geänderte Einzelwerte veröffentlichen
        #
        # Beispiel:
        #   B2500PKG/B2500_01/CD01/pe
        #   B2500PKG/B2500_01/CD01/w1
        #
        # retain=true, damit ein später per Discovery erzeugter
        # MQTT-Sensor sofort den letzten Wert erhält.
        # ----------------------------------------------------
        - if:
            - condition: template
              value_template: >-
                {{ cd_topic != '' and changed_count | int(0) > 0 }}
          then:
            - repeat:
                for_each: "{{ changed_keys }}"
                sequence:
                  - action: mqtt.publish
                    metadata: {}
                    data:
                      qos: 0
                      retain: true
                      topic: >-
                        B2500PKG/{{ speicher_nummer }}/{{ cd_topic }}/{{ repeat.item }}
                      payload: "{{ changed_dict[repeat.item] }}"

        # ----------------------------------------------------
        # Danach vollständiges Dictionary repostieren und
        # zuletzt last_updated setzen.
        # ----------------------------------------------------
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd01
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD01
                    payload: "{{ current_dict | to_json }}"
                
                - delay:
                    seconds: 0
                    milliseconds: 500
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD01/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd13
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD13
                    payload: "{{ current_dict | to_json }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD13/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd15
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD15
                    payload: "{{ current_dict | to_json }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD15/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd16
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD16
                    payload: "{{ current_dict | to_json }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD16/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd21
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD21
                    payload: "{{ current_dict | to_json }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD21/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd24
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD24
                    payload: "{{ current_dict | to_json }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD24/last_updated
                    payload: "{{ now_ts }}"

            - conditions:
                - condition: trigger
                  id:
                    - b2500_cd30_request
              sequence:
                # CD30 liefert neben dem eigentlichen Ereignisblock auch
                # kurze Antworten wie 01ff, 02ff oder 0ff0.
                # Nur der lange Hauptblock ist für uns relevant:
                #   - beginnt mit 00
                #   - muss mindestens 20 Hex-Zeichen lang sein
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "{{ device_topic }}"
                      payload: "valid_cd30"
                      value_template: >-
                        {% set v = value | string | trim | lower %}
                        {% if v.startswith('00') and (v | length) >= 20 %}
                          valid_cd30
                        {% else %}
                          ignore
                        {% endif %}
                  timeout: "00:00:05"
                  continue_on_timeout: false

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: true
                    topic: B2500PKG/{{ speicher_nummer }}/CD30
                    payload: "{{ wait.trigger.payload }}"

                - delay:
                    seconds: 1

                - action: mqtt.publish
                  metadata: {}
                  data:
                    qos: 0
                    retain: false
                    topic: B2500PKG/{{ speicher_nummer }}/CD30/last_updated
                    payload: "{{ now_ts }}"

  mode: parallel
  max: 10