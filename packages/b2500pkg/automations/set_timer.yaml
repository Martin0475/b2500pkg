script:
  b2500pkg_set_timer:
    alias: B2500PKG_Set_Timer
    description: >
      Setzt Status, Startzeit, Endzeit und/oder Leistung eines Timers oder aller
      Timer. Nicht übergebene Timerwerte werden aus den aktuellen Sensoren
      übernommen. Speicher und Timerslot müssen beim Aufruf angegeben werden.

    fields:
      speicher:
        name: Speicher
        description: Muss beim Aufruf übergeben werden.
        required: true
        example: "b2500_01"
        selector:
          select:
            options:
              - label: "B01"
                value: "b2500_01"
              - label: "B02"
                value: "b2500_02"
              - label: "B03"
                value: "b2500_03"
              - label: "B04"
                value: "b2500_04"
              - label: "B05"
                value: "b2500_05"
              - label: "B06"
                value: "b2500_06"
              - label: "B07"
                value: "b2500_07"
              - label: "B08"
                value: "b2500_08"
              - label: "B09"
                value: "b2500_09"
              - label: "Alle Speicher"
                value: "Alle_Speicher"

      timerslot:
        name: Timer
        description: Muss beim Aufruf übergeben werden.
        required: true
        example: "2"
        selector:
          select:
            options:
              - label: "Timer 1"
                value: "1"
              - label: "Timer 2"
                value: "2"
              - label: "Timer 3"
                value: "3"
              - label: "Timer 4"
                value: "4"
              - label: "Timer 5"
                value: "5"
              - label: "Alle Timer"
                value: "Alle_Timer"

      timer_aktiv:
        name: Timerstatus
        description: Optional. Nicht übergeben bedeutet aktuellen Sensorwert beibehalten.
        required: false
        selector:
          select:
            options:
              - label: "Aktiv"
                value: "1"
              - label: "Deaktiviert"
                value: "0"

      startzeit:
        name: Startzeit
        description: Optional. Nicht übergeben bedeutet aktuellen Sensorwert beibehalten.
        required: false
        example: "03:05"
        selector:
          time:

      endzeit:
        name: Endzeit
        description: Optional. Nicht übergeben bedeutet aktuellen Sensorwert beibehalten.
        required: false
        example: "23:59"
        selector:
          time:

      leistung:
        name: Leistung
        description: Optional. Nicht übergeben bedeutet aktuellen Sensorwert beibehalten.
        required: false
        example: 300
        selector:
          number:
            min: 0
            max: 800
            step: 1
            unit_of_measurement: W
            mode: box

    sequence:
      - variables:
          speicher_auswahl: >-
            {{ speicher | default('', true) | string | trim }}
          timerslot_auswahl: >-
            {{ timerslot | default('', true) | string | trim }}
          erlaubte_speicher:
            - "b2500_01"
            - "b2500_02"
            - "b2500_03"
            - "b2500_04"
            - "b2500_05"
            - "b2500_06"
            - "b2500_07"
            - "b2500_08"
            - "b2500_09"
            - "Alle_Speicher"

      - if:
          - condition: template
            value_template: "{{ speicher_auswahl == '' }}"
        then:
          - variables:
              response:
                success: false
                code: "MISSING_STORAGE"
                message: "Abbruch: Pflichtfeld 'speicher' wurde nicht übergeben."
          - stop: "Pflichtfeld 'speicher' fehlt."
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ speicher_auswahl not in erlaubte_speicher }}"
        then:
          - variables:
              response:
                success: false
                code: "INVALID_STORAGE"
                message: >-
                  Abbruch: Speicher '{{ speicher_auswahl }}' ist ungültig.
                  Erlaubt sind b2500_01 bis b2500_09 sowie Alle_Speicher.
          - stop: "Ungültiger Speicher."
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ timerslot_auswahl == '' }}"
        then:
          - variables:
              response:
                success: false
                code: "MISSING_TIMERSLOT"
                message: "Abbruch: Pflichtfeld 'timerslot' wurde nicht übergeben."
          - stop: "Pflichtfeld 'timerslot' fehlt."
            response_variable: response

      - if:
          - condition: template
            value_template: >-
              {{ (timerslot_auswahl | string | trim)
                 not in ['1', '2', '3', '4', '5', 'Alle_Timer'] }}
        then:
          - variables:
              response:
                success: false
                code: "INVALID_TIMERSLOT"
                message: >-
                  Abbruch: Timerslot '{{ timerslot_auswahl }}' ist ungültig.
                  Erlaubt sind 1 bis 5 sowie Alle_Timer.
          - stop: "Ungültiger Timerslot."
            response_variable: response

      - variables:

          set_status: >-
            {{ timer_aktiv is defined and timer_aktiv | string | trim != '' }}
          set_start: >-
            {{ startzeit is defined and startzeit | string | trim != '' }}
          set_ende: >-
            {{ endzeit is defined and endzeit | string | trim != '' }}
          set_leistung: >-
            {{ leistung is defined and leistung | string | trim != '' }}

          status_value: >-
            {{ timer_aktiv | int if set_status else 0 }}

          start_roh: >-
            {{ startzeit | string | trim if set_start else '' }}
          ende_roh: >-
            {{ endzeit | string | trim if set_ende else '' }}

          start_format_ok: >-
            {{ not set_start or
               (start_roh | regex_match('^\\d{1,2}:\\d{1,2}(:\\d{1,2})?$')) }}
          ende_format_ok: >-
            {{ not set_ende or
               (ende_roh | regex_match('^\\d{1,2}:\\d{1,2}(:\\d{1,2})?$')) }}

          start_stunde: >-
            {{ start_roh.split(':')[0] | int if start_format_ok and set_start else 0 }}
          start_minute: >-
            {{ start_roh.split(':')[1] | int if start_format_ok and set_start else 0 }}
          start_sekunde: >-
            {{ start_roh.split(':')[2] | int
               if start_format_ok and set_start and start_roh.split(':') | count == 3
               else 0 }}

          ende_stunde: >-
            {{ ende_roh.split(':')[0] | int if ende_format_ok and set_ende else 0 }}
          ende_minute: >-
            {{ ende_roh.split(':')[1] | int if ende_format_ok and set_ende else 0 }}
          ende_sekunde: >-
            {{ ende_roh.split(':')[2] | int
               if ende_format_ok and set_ende and ende_roh.split(':') | count == 3
               else 0 }}

          start_gueltig: >-
            {{ not set_start or
               (start_format_ok and start_sekunde == 0 and
                (0 <= start_stunde <= 23 and 0 <= start_minute <= 59)) }}

          ende_gueltig: >-
            {{ not set_ende or
               (ende_format_ok and ende_sekunde == 0 and
                (0 <= ende_stunde <= 23 and 0 <= ende_minute <= 59)) }}

          start_value: >-
            {{ start_stunde ~ ':' ~ start_minute if set_start and start_gueltig else '' }}
          ende_value: >-
            {{ ende_stunde ~ ':' ~ ende_minute if set_ende and ende_gueltig else '' }}

          leistung_value: >-
            {{ leistung | int if set_leistung else 0 }}

          status_gueltig: >-
            {{ not set_status or (timer_aktiv | string | trim) in ['0', '1'] }}
          leistung_gueltig: >-
            {{ not set_leistung or
               ((leistung | string | trim) | regex_match('^\\d+$') and
                0 <= (leistung | int) <= 800) }}

          all_speicher: "{{ states('input_text.b2500_all') | from_json }}"

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

          slot_all: >-
            {{ (timerslot_auswahl | string | trim) == 'Alle_Timer' }}
          slot_nummer: >-
            {{ 0 if slot_all else (timerslot_auswahl | string | trim) | int }}

      - if:
          - condition: template
            value_template: "{{ set_status and not status_gueltig }}"
        then:
          - variables:
              response:
                success: false
                code: "INVALID_STATUS"
                message: >-
                  Abbruch: Timerstatus '{{ timer_aktiv }}' ist ungültig.
                  Erlaubt sind 0 (deaktiviert) und 1 (aktiv).
          - stop: "Ungültiger Timerstatus."
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ set_start and not start_gueltig }}"
        then:
          - variables:
              response:
                success: false
                code: "INVALID_START_TIME"
                message: >-
                  Abbruch: Startzeit '{{ start_roh }}' ist ungültig.
                  Erlaubt sind 0:0 bis 23:59; Sekunden müssen 00 sein.
          - stop: "Ungültige Startzeit."
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ set_ende and not ende_gueltig }}"
        then:
          - variables:
              response:
                success: false
                code: "INVALID_END_TIME"
                message: >-
                  Abbruch: Endzeit '{{ ende_roh }}' ist ungültig.
                  Erlaubt sind 0:0 bis 23:59; Sekunden müssen 00 sein.
          - stop: "Ungültige Endzeit."
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ set_leistung and not leistung_gueltig }}"
        then:
          - variables:
              response:
                success: false
                code: "INVALID_POWER"
                message: >-
                  Abbruch: Leistung '{{ leistung }}' ist ungültig.
                  Erlaubt sind ganzzahlige Werte von 0 bis 800 W.
          - stop: "Ungültige Leistung."
            response_variable: response

      - if:
          - condition: template
            value_template: >-
              {{ not (set_status or set_start or set_ende or set_leistung) }}
        then:
          - variables:
              response:
                success: false
                code: "NO_CHANGE_PARAMETER"
                message: >-
                  Abbruch: Es wurde kein zu ändernder Timerwert übergeben.
                  Übergib mindestens timer_aktiv, startzeit, endzeit oder leistung.
          - stop: "Kein Änderungsparameter übergeben."
            response_variable: response

      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - variables:
                num: "{{ repeat.item.split('_')[-1] }}"

                a1: >-
                  {{ status_value | int
                     if set_status and (slot_all or slot_nummer == 1)
                     else (1 if is_state('binary_sensor.b2500_' ~ num ~ '_d1', 'on') else 0) }}
                a2: >-
                  {{ status_value | int
                     if set_status and (slot_all or slot_nummer == 2)
                     else (1 if is_state('binary_sensor.b2500_' ~ num ~ '_d2', 'on') else 0) }}
                a3: >-
                  {{ status_value | int
                     if set_status and (slot_all or slot_nummer == 3)
                     else (1 if is_state('binary_sensor.b2500_' ~ num ~ '_d3', 'on') else 0) }}
                a4: >-
                  {{ status_value | int
                     if set_status and (slot_all or slot_nummer == 4)
                     else (1 if is_state('binary_sensor.b2500_' ~ num ~ '_d4', 'on') else 0) }}
                a5: >-
                  {{ status_value | int
                     if set_status and (slot_all or slot_nummer == 5)
                     else (1 if is_state('binary_sensor.b2500_' ~ num ~ '_d5', 'on') else 0) }}

                b1: >-
                  {{ start_value
                     if set_start and (slot_all or slot_nummer == 1)
                     else states('sensor.b2500_' ~ num ~ '_e1') }}
                b2: >-
                  {{ start_value
                     if set_start and (slot_all or slot_nummer == 2)
                     else states('sensor.b2500_' ~ num ~ '_e2') }}
                b3: >-
                  {{ start_value
                     if set_start and (slot_all or slot_nummer == 3)
                     else states('sensor.b2500_' ~ num ~ '_e3') }}
                b4: >-
                  {{ start_value
                     if set_start and (slot_all or slot_nummer == 4)
                     else states('sensor.b2500_' ~ num ~ '_e4') }}
                b5: >-
                  {{ start_value
                     if set_start and (slot_all or slot_nummer == 5)
                     else states('sensor.b2500_' ~ num ~ '_e5') }}

                e1: >-
                  {{ ende_value
                     if set_ende and (slot_all or slot_nummer == 1)
                     else states('sensor.b2500_' ~ num ~ '_f1') }}
                e2: >-
                  {{ ende_value
                     if set_ende and (slot_all or slot_nummer == 2)
                     else states('sensor.b2500_' ~ num ~ '_f2') }}
                e3: >-
                  {{ ende_value
                     if set_ende and (slot_all or slot_nummer == 3)
                     else states('sensor.b2500_' ~ num ~ '_f3') }}
                e4: >-
                  {{ ende_value
                     if set_ende and (slot_all or slot_nummer == 4)
                     else states('sensor.b2500_' ~ num ~ '_f4') }}
                e5: >-
                  {{ ende_value
                     if set_ende and (slot_all or slot_nummer == 5)
                     else states('sensor.b2500_' ~ num ~ '_f5') }}

                v1: >-
                  {{ leistung_value | int
                     if set_leistung and (slot_all or slot_nummer == 1)
                     else states('sensor.b2500_' ~ num ~ '_h1') | int }}
                v2: >-
                  {{ leistung_value | int
                     if set_leistung and (slot_all or slot_nummer == 2)
                     else states('sensor.b2500_' ~ num ~ '_h2') | int }}
                v3: >-
                  {{ leistung_value | int
                     if set_leistung and (slot_all or slot_nummer == 3)
                     else states('sensor.b2500_' ~ num ~ '_h3') | int }}
                v4: >-
                  {{ leistung_value | int
                     if set_leistung and (slot_all or slot_nummer == 4)
                     else states('sensor.b2500_' ~ num ~ '_h4') | int }}
                v5: >-
                  {{ leistung_value | int
                     if set_leistung and (slot_all or slot_nummer == 5)
                     else states('sensor.b2500_' ~ num ~ '_h5') | int }}

                timer_payload: >-
                  cd=20,md=0,
                  a1={{ a1 }},b1={{ b1 }},e1={{ e1 }},v1={{ v1 }},
                  a2={{ a2 }},b2={{ b2 }},e2={{ e2 }},v2={{ v2 }},
                  a3={{ a3 }},b3={{ b3 }},e3={{ e3 }},v3={{ v3 }},
                  a4={{ a4 }},b4={{ b4 }},e4={{ e4 }},v4={{ v4 }},
                  a5={{ a5 }},b5={{ b5 }},e5={{ e5 }},v5={{ v5 }}

                expected_answer: >-
                  {{
                    {
                      'd1': a1 | int,
                      'e1': b1 | string,
                      'f1': e1 | string,
                      'h1': v1 | int,
                      'd2': a2 | int,
                      'e2': b2 | string,
                      'f2': e2 | string,
                      'h2': v2 | int,
                      'd3': a3 | int,
                      'e3': b3 | string,
                      'f3': e3 | string,
                      'h3': v3 | int,
                      'd4': a4 | int,
                      'e4': b4 | string,
                      'f4': e4 | string,
                      'h4': v4 | int,
                      'd5': a5 | int,
                      'e5': b5 | string,
                      'f5': e5 | string,
                      'h5': v5 | int
                    }
                  }}

            - action: script.turn_on
              target:
                entity_id: "script.{{ repeat.item }}_worker"
              data:
                variables:
                  payload: "{{ timer_payload | replace('\n', '') | replace(' ', '') }}"
                  followup_payload: "cd=01"
                  no_check: false
                  expected_answer: "{{ expected_answer }}"

            - delay:
                seconds: 1

      - variables:
          response:
            success: true
            code: "WORKER_STARTED"
            message: >-
              Timerauftrag wurde für {{ targets | count }} Speicher gestartet.
            speicher: "{{ speicher_auswahl }}"
            timerslot: "{{ timerslot_auswahl }}"
            geaendert:
              timer_aktiv: "{{ set_status }}"
              startzeit: "{{ set_start }}"
              endzeit: "{{ set_ende }}"
              leistung: "{{ set_leistung }}"

      - stop: "Timerauftrag gestartet."
        response_variable: response

    mode: queued
    max: 20


  b2500pkg_set_selbstanpassung:
    alias: B2500PKG_Set_Selbstanpassung
    description: >
      Aktiviert die Selbstanpassung für einen oder alle Speicher. Leeres
      Aktionsfeld verwendet input_select.speicherauswahl.

    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: "b2500_01"
        selector:
          select:
            options:
              - label: "B01"
                value: "b2500_01"
              - label: "B02"
                value: "b2500_02"
              - label: "B03"
                value: "b2500_03"
              - label: "B04"
                value: "b2500_04"
              - label: "B05"
                value: "b2500_05"
              - label: "B06"
                value: "b2500_06"
              - label: "B07"
                value: "b2500_07"
              - label: "B08"
                value: "b2500_08"
              - label: "B09"
                value: "b2500_09"
              - label: "Alle Speicher"
                value: "Alle_Speicher"

    sequence:
      - variables:
          speicher_auswahl: >-
            {% if speicher is defined and speicher | string | trim != '' %}
              {{ speicher }}
            {% else %}
              {{ states('input_select.speicherauswahl') }}
            {% endif %}

          all_speicher: "{{ states('input_text.b2500_all') | from_json }}"

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: "script.{{ repeat.item }}_worker"
              data:
                variables:
                  payload: "cd=20,md=1"
                  followup_payload: "cd=01"
                  no_check: false
                  expected_answer: >-
                    {{ {'md': 'Selbstanpassung'} }}

            - delay:
                seconds: 1

    mode: queued
    max: 10


  b2500pkg_timer_dashboard:
    alias: B2500PKG Timer Dashboard
    description: >
      Liest die Timer-Helper des Dashboards und ruft das universelle
      Script b2500pkg_set_timer nur mit den ausgewählten Änderungswerten auf.
    icon: mdi:timer-edit

    sequence:
      - variables:
          speicher_auswahl: "{{ states('input_select.speicherauswahl') }}"
          timerslot_auswahl: "{{ states('input_select.timerslot') }}"

          timer_ein: "{{ is_state('input_boolean.b2500_timer_ein', 'on') }}"
          timer_aus: "{{ is_state('input_boolean.b2500_timer_aus', 'on') }}"

          startzeit_aendern: >-
            {{ is_state('input_boolean.b2500_timer_startzeit_aendern', 'on') }}
          endzeit_aendern: >-
            {{ is_state('input_boolean.b2500_timer_endzeit_aendern', 'on') }}
          leistung_aendern: >-
            {{ is_state('input_boolean.b2500_timer_leistung_aendern', 'on') }}

      - if:
          - condition: template
            value_template: "{{ timer_ein and timer_aus }}"
        then:
          - variables:
              response:
                success: false
                code: "CONFLICTING_TIMER_STATUS"
                message: >-
                  Abbruch: „Timer einschalten“ und „Timer ausschalten“
                  sind gleichzeitig ausgewählt.
          - stop: "Widersprüchliche Timerstatus-Auswahl."
            response_variable: response

      - if:
          - condition: template
            value_template: >-
              {{ not (
                   timer_ein
                   or timer_aus
                   or startzeit_aendern
                   or endzeit_aendern
                   or leistung_aendern
                 ) }}
        then:
          - variables:
              response:
                success: false
                code: "NO_CHANGE_SELECTED"
                message: >-
                  Abbruch: Es wurde kein zu ändernder Timerwert ausgewählt.
          - stop: "Keine Änderung ausgewählt."
            response_variable: response

      - variables:
          timer_daten: >-
            {% set ns = namespace(data={
              'speicher': speicher_auswahl,
              'timerslot': timerslot_auswahl
            }) %}

            {% if timer_ein %}
              {% set ns.data = dict(ns.data, timer_aktiv=1) %}
            {% elif timer_aus %}
              {% set ns.data = dict(ns.data, timer_aktiv=0) %}
            {% endif %}

            {% if startzeit_aendern %}
              {% set ns.data = dict(
                ns.data,
                startzeit=states('input_datetime.timer_beginn')
              ) %}
            {% endif %}

            {% if endzeit_aendern %}
              {% set ns.data = dict(
                ns.data,
                endzeit=states('input_datetime.timer_ende')
              ) %}
            {% endif %}

            {% if leistung_aendern %}
              {% set ns.data = dict(
                ns.data,
                leistung=states('input_number.timer_leistung') | int
              ) %}
            {% endif %}

            {{ ns.data }}

      - action: script.b2500pkg_set_timer
        data: "{{ timer_daten }}"
        response_variable: timer_response

      - if:
          - condition: template
            value_template: >-
              {{ timer_response is mapping
                 and timer_response.success | default(false) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.b2500_timer_ein
                - input_boolean.b2500_timer_aus
                - input_boolean.b2500_timer_startzeit_aendern
                - input_boolean.b2500_timer_endzeit_aendern
                - input_boolean.b2500_timer_leistung_aendern

      - variables:
          response: >-
            {% if timer_response is mapping %}
              {{ timer_response }}
            {% else %}
              {{
                {
                  'success': false,
                  'code': 'NO_TIMER_RESPONSE',
                  'message': 'Das Timer-Script hat keine gültige Response geliefert.'
                }
              }}
            {% endif %}

      - stop: "Dashboard-Timerauftrag abgeschlossen."
        response_variable: response

    mode: single