                      {% raw %}{"name":"B01 PV2 Input Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('m2=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16m2","unique_id":"b2500_01_cd16m2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: c2
                    topic_suffix: cd16c2
                    config: >-
                      {% raw %}{"name":"B01 PV2 Input Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('c2=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16c2","unique_id":"b2500_01_cd16c2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  - source_key: bb
                    topic_suffix: cd16bb
                    config: >-
                      {% raw %}{"name":"B01 Akku Power","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('bb=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_cd16bb","unique_id":"b2500_01_cd16bb","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: bv
                    topic_suffix: cd16bv
                    config: >-
                      {% raw %}{"name":"B01 Akku Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('bv=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16bv","unique_id":"b2500_01_cd16bv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: bc
