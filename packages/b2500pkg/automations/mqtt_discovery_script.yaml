                                      payload: >-
                                        {{ discovery_payload }}


                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script
                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} Timer ............... OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD16 STATISTIK ERZEUGEN
                # Bereich ist vorbereitet; aktuell noch keine Entitäten
                # zugeordnet. Beim späteren Verschieben bleibt dieselbe
                # Datenblock- und Statusfenster-Logik erhalten.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16_Statistik', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_statistik_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {% set ext = repeat.item.extension | default(0) | int(0) %}
                                  {{
                                    repeat.item.source_key in cd16_dict
                                    and
                                    (
                                      ext == 0
                                      or (ext == 1 and expansion1_present)
                                      or (ext == 2 and expansion2_present)
                                    )
                                  }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('§§', current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}

                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} CD16 Statistik ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD16 OPTIONAL ERZEUGEN
                # Hauptwerte inkl. p1/p2: nur wenn das Kürzel im frischen CD16
                # tatsächlich vorhanden ist.
                # E1 sb/sv/sc: zusätzlich nur bei frischem CD01 b1=1.
                # E2 lb/lv/lc: zusätzlich nur bei frischem CD01 b2=1.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16_Optional', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_optional_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {% set ext = repeat.item.extension | default(0) | int(0) %}
                                  {{
                                    repeat.item.source_key in cd16_dict
                                    and
                                    (
                                      ext == 0
                                      or (ext == 1 and expansion1_present)
                                      or (ext == 2 and expansion2_present)
                                    )
                                  }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('§§', current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}

                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} CD16 optional ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # KALIBRIERUNGSDATEN ERZEUGEN
                # CD21: cf = Laden, df = Entladen, Rohwert in µAh.
                # Discovery rechnet auf Ah um.
                # Nur vorhandene Kürzel werden angelegt.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Kalibrierungsdaten', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ calibration_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ repeat.item.source_key in cd21_dict }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('§§', current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}

                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} Kalibrierung ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

      # ============================================================
      # 3. Rückgabe
      # ============================================================
      - event: b2500pkg_status
        event_data:
          status: ERFOLGREICH
          titel: B2500PKG Discovery
          untertitel: >-
            {{ speicher_auswahl }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
          meldung: Discovery abgeschlossen
          details: "Discovery abgeschlossen ........ OK"
          append: true
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_discovery_script

      - variables:
          response:
            success: true
            code: DISCOVERY_OK
            message: Discovery-Auftrag ausgeführt.
            speicher: "{{ speicher_auswahl }}"
            bereich: "{{ bereich_auswahl }}"
            aktion: "{{ aktion_auswahl }}"
            targets: "{{ targets }}"
            loeschen: "{{ do_delete }}"
            erzeugen: "{{ do_create }}"

      - stop: Discovery-Auftrag ausgeführt.
        response_variable: response


      # Manuell konfigurierte MQTT-Entitäten nach Discovery-Lauf neu laden
      - action: mqtt.reload
    mode: queued
    max: 10
    trace:
      stored_traces: 0
