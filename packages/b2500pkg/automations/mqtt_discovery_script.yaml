                    config: >-
                      {% raw %}{"name":"B01 Akku Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('bc=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16bc","unique_id":"b2500_01_cd16bc","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  - source_key: g1
                    topic_suffix: cd16g1
                    config: >-
                      {% raw %}{"name":"B01 Output1 Leistung","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('g1=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_cd16g1","unique_id":"b2500_01_cd16g1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: i1
                    topic_suffix: cd16i1
                    config: >-
                      {% raw %}{"name":"B01 Output1 Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('i1=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16i1","unique_id":"b2500_01_cd16i1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: c3
                    topic_suffix: cd16c3
                    config: >-
                      {% raw %}{"name":"B01 Output1 Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('c3=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16c3","unique_id":"b2500_01_cd16c3","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  - source_key: g2
                    topic_suffix: cd16g2
                    config: >-
                      {% raw %}{"name":"B01 Output2 Leistung","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('g2=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_cd16g2","unique_id":"b2500_01_cd16g2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: i2
                    topic_suffix: cd16i2
                    config: >-
                      {% raw %}{"name":"B01 Output2 Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('i2=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16i2","unique_id":"b2500_01_cd16i2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: c4
                    topic_suffix: cd16c4
                    config: >-
                      {% raw %}{"name":"B01 Output2 Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('c4=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16c4","unique_id":"b2500_01_cd16c4","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  # ------------------------------------------------
                  # Erweiterungsakku E1: nur erzeugen, wenn CD01 b1=1
                  # ------------------------------------------------
                  - source_key: sb
                    topic_suffix: cd16sb
                    extension: 1
                    config: >-
                      {% raw %}{"name":"B01E1 Akku Power","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('sb=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_cd16sb","unique_id":"b2500_01_cd16sb","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sv
                    topic_suffix: cd16sv
                    extension: 1
                    config: >-
                      {% raw %}{"name":"B01E1 Akku Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('sv=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16sv","unique_id":"b2500_01_cd16sv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sc
                    topic_suffix: cd16sc
                    extension: 1
                    config: >-
                      {% raw %}{"name":"B01E1 Akku Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('sc=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16sc","unique_id":"b2500_01_cd16sc","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  # ------------------------------------------------
                  # Erweiterungsakku E2: nur erzeugen, wenn CD01 b2=1
                  # ------------------------------------------------
                  - source_key: lb
                    topic_suffix: cd16lb
                    extension: 2
                    config: >-
                      {% raw %}{"name":"B01E2 Akku Power","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('lb=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_cd16lb","unique_id":"b2500_01_cd16lb","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lv
                    topic_suffix: cd16lv
                    extension: 2
                    config: >-
                      {% raw %}{"name":"B01E2 Akku Voltage","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value.split('lv=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16lv","unique_id":"b2500_01_cd16lv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lc
                    topic_suffix: cd16lc
                    extension: 2
                    config: >-
                      {% raw %}{"name":"B01E2 Akku Current","state_topic":"B2500PKG/B2500_01/CD16","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value.split('lc=')[1].split(',')[0] | float) / 1000 }}","default_entity_id":"sensor.b2500_01_cd16lc","unique_id":"b2500_01_cd16lc","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                calibration_entities:
                  - source_key: cf
                    topic_suffix: cd21cf
                    config: >-
                      {% raw %}{"name":"B01 Kalibrierung Laden","state_topic":"B2500PKG/B2500_01/CD21","unit_of_measurement":"Ah","state_class":"measurement","suggested_display_precision":2,"value_template":"{{ (value.split('cf=')[1].split(',')[0] | float) / 1000000 }}","default_entity_id":"sensor.b2500_01_cd21cf","unique_id":"b2500_01_cd21cf","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: df
                    topic_suffix: cd21df
                    config: >-
                      {% raw %}{"name":"B01 Kalibrierung Entladen","state_topic":"B2500PKG/B2500_01/CD21","unit_of_measurement":"Ah","state_class":"measurement","suggested_display_precision":2,"value_template":"{{ (value.split('df=')[1].split(',')[0] | float) / 1000000 }}","default_entity_id":"sensor.b2500_01_cd21df","unique_id":"b2500_01_cd21df","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

            # ======================================================
            # ZENTRALE DATENAKTUALISIERUNG
            #
            # Bei Neu_erstellen bewusst VOR dem Löschen.
            # Jeder benötigte Rohdatensatz (CD01/CD13/CD16/CD21)
            # wird pro Speicher nur einmal frisch angefordert.
            # ======================================================
            - variables:
                cd01_payload: ""
                cd13_payload: ""
                cd16_payload: ""
                cd21_payload: ""

            - if:
                - condition: template
                  value_template: "{{ need_cd01 }}"
              then:
                # Alten retained Rohdatensatz entfernen, damit nur
                # die neue Antwort als Grundlage verwendet wird.
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD01"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=01"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                # Das CD01-Roh-Topic ist retained. Nach Abschluss des
                # Workers liefert die Subscription sofort den frisch
                # geschriebenen Datensatz.
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD01"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd01_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd13 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD13"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=13"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD13"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd13_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd16 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD16"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=16"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD16"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd16_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd21 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD21"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=21"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD21"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd21_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            # Erweiterungsspeicher werden ausschließlich über CD01
            # als vorhanden erkannt. CD13-Nullwerte allein reichen nicht.
            - variables:
                expansion1_present: >-
                  {{
                    'b1=' in cd01_payload and
                    (cd01_payload.split('b1=')[1].split(',')[0] | int(0)) == 1
                  }}
                expansion2_present: >-
                  {{
                    'b2=' in cd01_payload and
                    (cd01_payload.split('b2=')[1].split(',')[0] | int(0)) == 1
                  }}

            # ======================================================
            # LÖSCHEN
            # bei Aktion Loeschen oder Neu_erstellen
            # ======================================================
            - if:
                - condition: template
                  value_template: "{{ do_delete }}"
              then:

                # --------------------------------------------------
                # HAUPTSPEICHER – ENTITÄTEN LÖSCHEN
                # komplette bisherige CD01-Haupt-Discovery
                # ohne Timer und ohne Zellspannungen
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: >
                        {{ bereich_auswahl in ['Hauptspeicher_Entitaeten', 'Alle'] }}
                  then:
                    - repeat:
                        for_each: "{{ hauptspeicher_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                # --------------------------------------------------
                # SPANNUNGEN LÖSCHEN
                #
                # Hauptspeicher: a0 ... af
                # Erweiterung E1: b0 ... bf
                # Erweiterung E2: c0 ... cf
                #
                # Beim Löschen immer ALLE 48 bekannten Topics,
                # unabhängig davon, ob E1/E2 aktuell vorhanden sind.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Spannungen', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each:
                          - a0
                          - a1
                          - a2
                          - a3
                          - a4
                          - a5
                          - a6
                          - a7
                          - a8
                          - a9
                          - aa
                          - ab
                          - ac
                          - ad
                          - ae
                          - af
                          - b0
                          - b1
                          - b2
                          - b3
                          - b4
                          - b5
                          - b6
                          - b7
                          - b8
                          - b9
                          - ba
                          - bb
                          - bc
                          - bd
                          - be
                          - bf
                          - c0
                          - c1
                          - c2
                          - c3
                          - c4
                          - c5
                          - c6
                          - c7
                          - c8
                          - c9
                          - ca
                          - cb
                          - cc
                          - cd
                          - ce
                          - cf
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ repeat.item }}/config
                              payload: ""
                              retain: true

                # --------------------------------------------------
                # TIMER LÖSCHEN
                #
                # d1..d5  = Timer aktiv (binary_sensor)
                # e1..e5  = Beginn
                # f1..f5  = Ende
                # h1..h5  = Ausgabeleistung
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Timer', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each:
                          - 1
                          - 2
                          - 3
                          - 4
                          - 5
                        sequence:
                          - variables:
                              timer_slot: "{{ repeat.item }}"

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/binary_sensor/b2500_{{ current_number }}/d{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/e{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/f{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/h{{ timer_slot }}/config
                              payload: ""
                              retain: true

                # --------------------------------------------------
                # CD16 LÖSCHEN
                # Beim Löschen immer alle 23 definierten Topics:
                # 17 Hauptwerte inkl. p1/p2 + 6 optionale Erweiterungsakku-Werte.
                # Unabhängig davon, ob b1/b2 aktuell aktiv sind.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                # --------------------------------------------------
                # KALIBRIERUNGSDATEN LÖSCHEN
                # cf / df immer vollständig entfernen.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Kalibrierungsdaten', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ calibration_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

            # ======================================================
            # ERZEUGEN
            # bei Aktion Erzeugen oder Neu_erstellen
            # ======================================================
            - if:
                - condition: template
                  value_template: "{{ do_create }}"
              then:

                # --------------------------------------------------
                # HAUPTSPEICHER – ENTITÄTEN ERZEUGEN
                #
                # Die MQTT-Discovery-Konfigurationen stammen aus der
                # bisherigen B01-CD01-Discovery. Nur Speicherbezug,
                # IDs und Topics werden dynamisch auf current_number
                # umgeschrieben.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: >
                        {{ bereich_auswahl in ['Hauptspeicher_Entitaeten', 'Alle'] }}
                  then:
                    - repeat:
                        for_each: "{{ hauptspeicher_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (repeat.item.source_key ~ '=') in cd01_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('B2500_01', 'B2500_' ~ current_number)
                                      | replace('b2500_01', 'b2500_' ~ current_number)
                                      | replace('B01', 'B' ~ current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}

                # --------------------------------------------------
                # SPANNUNGEN ERZEUGEN
                #
                # CD01 liefert b1/b2 zur Erkennung der Erweiterungen.
                # CD13 liefert a0..af, b0..bf und c0..cf.
                #
                # Hauptspeicher:
                #   jeweiliges aX-Kürzel muss in CD13 vorhanden sein.
                #
                # E1:
                #   CD01 b1=1 UND jeweiliges bX-Kürzel in CD13.
                #
                # E2:
                #   CD01 b2=1 UND jeweiliges cX-Kürzel in CD13.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Spannungen', 'Alle'] }}"
                  then:
                    # Hauptspeicher a0 ... af
                    - repeat:
                        for_each:
                          - key: a0
                            cell: "01"
                          - key: a1
                            cell: "02"
                          - key: a2
                            cell: "03"
                          - key: a3
                            cell: "04"
                          - key: a4
                            cell: "05"
                          - key: a5
                            cell: "06"
                          - key: a6
                            cell: "07"
                          - key: a7
                            cell: "08"
                          - key: a8
                            cell: "09"
                          - key: a9
                            cell: "10"
                          - key: aa
                            cell: "11"
                          - key: ab
                            cell: "12"
                          - key: ac
                            cell: "13"
                          - key: ad
                            cell: "14"
                          - key: ae
                            cell: "15"
                          - key: af
                            cell: "16"
                        sequence:
                          - variables:
                              voltage_key: "{{ repeat.item.key }}"
                              cell_number: "{{ repeat.item.cell }}"

                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (voltage_key ~ '=') in cd13_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ voltage_key }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ ' Zelle' ~ cell_number,
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD13',
                                        'device_class': 'voltage',
                                        'unit_of_measurement': 'mV',
                                        'value_template':
                                          "{{ value.split('" ~ voltage_key ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_zelle' ~ cell_number,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_zelle' ~ cell_number,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                    # Erweiterungen b0 ... bf / c0 ... cf
                    - repeat:
                        for_each:
                          - key: b0
                            extension: 1
                            cell: "01"
                          - key: b1
                            extension: 1
                            cell: "02"
                          - key: b2
                            extension: 1
                            cell: "03"
                          - key: b3
                            extension: 1
                            cell: "04"
                          - key: b4
                            extension: 1
                            cell: "05"
                          - key: b5
                            extension: 1
                            cell: "06"
                          - key: b6
                            extension: 1
                            cell: "07"
                          - key: b7
                            extension: 1
                            cell: "08"
                          - key: b8
                            extension: 1
                            cell: "09"
                          - key: b9
                            extension: 1
                            cell: "10"
                          - key: ba
                            extension: 1
                            cell: "11"
                          - key: bb
                            extension: 1
                            cell: "12"
                          - key: bc
                            extension: 1
                            cell: "13"
                          - key: bd
                            extension: 1
                            cell: "14"
                          - key: be
                            extension: 1
                            cell: "15"
                          - key: bf
                            extension: 1
                            cell: "16"
                          - key: c0
                            extension: 2
                            cell: "01"
                          - key: c1
                            extension: 2
                            cell: "02"
                          - key: c2
                            extension: 2
                            cell: "03"
                          - key: c3
                            extension: 2
                            cell: "04"
                          - key: c4
                            extension: 2
                            cell: "05"
                          - key: c5
                            extension: 2
                            cell: "06"
                          - key: c6
                            extension: 2
                            cell: "07"
                          - key: c7
                            extension: 2
                            cell: "08"
                          - key: c8
                            extension: 2
                            cell: "09"
                          - key: c9
                            extension: 2
                            cell: "10"
                          - key: ca
                            extension: 2
                            cell: "11"
                          - key: cb
                            extension: 2
                            cell: "12"
                          - key: cc
                            extension: 2
                            cell: "13"
                          - key: cd
                            extension: 2
                            cell: "14"
                          - key: ce
                            extension: 2
                            cell: "15"
                          - key: cf
                            extension: 2
                            cell: "16"
                        sequence:
                          - variables:
                              voltage_key: "{{ repeat.item.key }}"
                              extension_number: "{{ repeat.item.extension }}"
                              cell_number: "{{ repeat.item.cell }}"

                          - if:
                              - condition: template
                                value_template: >-
                                  {{
                                    (voltage_key ~ '=') in cd13_payload and
                                    (
                                      (extension_number | int == 1 and expansion1_present) or
                                      (extension_number | int == 2 and expansion2_present)
                                    )
                                  }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ voltage_key }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ 'E' ~ extension_number ~ ' Zelle' ~ cell_number,
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD13',
                                        'device_class': 'voltage',
                                        'unit_of_measurement': 'mV',
                                        'value_template':
                                          "{{ value.split('" ~ voltage_key ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_extern' ~ extension_number ~ '_zelle' ~ cell_number,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_extern' ~ extension_number ~ '_zelle' ~ cell_number,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                # --------------------------------------------------
                # TIMER ERZEUGEN
                #
                # Die Konfigurationen entsprechen der bisherigen
                # B01-Discovery, werden jetzt aber dynamisch für
                # current_number erzeugt.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Timer', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each:
                          - 1
                          - 2
                          - 3
                          - 4
                          - 5
                        sequence:
                          - variables:
                              timer_slot: "{{ repeat.item }}"
                              key_d: "d{{ repeat.item }}"
                              key_e: "e{{ repeat.item }}"
                              key_f: "f{{ repeat.item }}"
                              key_h: "h{{ repeat.item }}"

                          # Timer aktiv
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (key_d ~ '=') in cd01_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/binary_sensor/b2500_{{ current_number }}/{{ key_d }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ ' Timer' ~ timer_slot ~ ' aktiv',
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD01',
                                        'payload_on': '1',
                                        'payload_off': '0',
                                        'value_template':
                                          "{{ value.split('" ~ key_d ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'binary_sensor.b2500_' ~ current_number ~ '_' ~ key_d,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_' ~ key_d,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                          # Timer Beginn
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (key_e ~ '=') in cd01_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ key_e }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ ' Timer' ~ timer_slot ~ ' Beginn',
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD01',
                                        'value_template':
                                          "{{ value.split('" ~ key_e ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_' ~ key_e,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_' ~ key_e,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                          # Timer Ende
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (key_f ~ '=') in cd01_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ key_f }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ ' Timer' ~ timer_slot ~ ' Ende',
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD01',
                                        'value_template':
                                          "{{ value.split('" ~ key_f ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_' ~ key_f,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_' ~ key_f,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                          # Timer Ausgabeleistung
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (key_h ~ '=') in cd01_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ key_h }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      {
                                        'name':
                                          'B' ~ current_number ~ ' Timer' ~ timer_slot ~ ' Ausgabeleistung',
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD01',
                                        'unit_of_measurement': 'W',
                                        'value_template':
                                          "{{ value.split('" ~ key_h ~ "=')[1].split(',')[0] }}",
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_' ~ key_h,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_' ~ key_h,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B2500 B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}

                # --------------------------------------------------
                # CD16 ERZEUGEN
                # Hauptwerte inkl. p1/p2: nur wenn das Kürzel im frischen CD16
                # tatsächlich vorhanden ist.
                # E1 sb/sv/sc: zusätzlich nur bei frischem CD01 b1=1.
                # E2 lb/lv/lc: zusätzlich nur bei frischem CD01 b2=1.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {% set ext = repeat.item.extension | default(0) | int(0) %}
                                  {{
                                    (repeat.item.source_key ~ '=') in cd16_payload
                                    and
                                    (
                                      ext == 0
                                      or (ext == 1 and expansion1_present)
                                      or (ext == 2 and expansion2_present)
                                    )
                                  }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('B2500_01', 'B2500_' ~ current_number)
                                      | replace('b2500_01', 'b2500_' ~ current_number)
                                      | replace('B01', 'B' ~ current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}

                # --------------------------------------------------
                # KALIBRIERUNGSDATEN ERZEUGEN
                # CD21: cf = Laden, df = Entladen, Rohwert in µAh.
                # Discovery rechnet auf Ah um.
                # Nur vorhandene Kürzel werden angelegt.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Kalibrierungsdaten', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ calibration_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ (repeat.item.source_key ~ '=') in cd21_payload }}
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                  retain: true
                                  payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('B2500_01', 'B2500_' ~ current_number)
                                      | replace('b2500_01', 'b2500_' ~ current_number)
                                      | replace('B01', 'B' ~ current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}

      # ============================================================
      # 3. Rückgabe
      # ============================================================
      - variables:
          response:
            success: true
            code: DISCOVERY_OK
            message: Discovery-Auftrag ausgeführt.
            speicher: "{{ speicher_auswahl }}"
            bereich: "{{ bereich_auswahl }}"
            aktion: "{{ aktion_auswahl }}"
            targets: "{{ targets }}"
            loeschen: "{{ do_delete }}"
            erzeugen: "{{ do_create }}"

      - stop: Discovery-Auftrag ausgeführt.
        response_variable: response


      # Manuell konfigurierte MQTT-Entitäten nach Discovery-Lauf neu laden
      - action: mqtt.reload
    mode: queued
    max: 10
