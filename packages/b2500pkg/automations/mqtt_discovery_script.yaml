script:
  b2500pkg_discovery_script:
    alias: B2500PKG_Discovery_Script
    description: >
      Verwaltet die MQTT-Discovery-Entitäten der B2500-Speicher.
      Speicher, Bereich und Aktion können gezielt ausgewählt werden.
      Unterstützt Erzeugen, Löschen und Neuerstellen einzelner
      Discovery-Bereiche sowie aller konfigurierten Speicher.

    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: "b2500_01"
        selector:
          select:
            options:
              - {label: "B01", value: "b2500_01"}
              - {label: "B02", value: "b2500_02"}
              - {label: "B03", value: "b2500_03"}
              - {label: "B04", value: "b2500_04"}
              - {label: "B05", value: "b2500_05"}
              - {label: "B06", value: "b2500_06"}
              - {label: "B07", value: "b2500_07"}
              - {label: "B08", value: "b2500_08"}
              - {label: "B09", value: "b2500_09"}
              - {label: "Alle Speicher", value: "Alle_Speicher"}

      bereich:
        name: Bereich
        description: Discovery-Bereich, der bearbeitet werden soll.
        required: true
        selector:
          select:
            options:
              - {label: "Hauptspeicher – Entitäten", value: "Hauptspeicher_Entitaeten"}
              - {label: "Spannungen", value: "Spannungen"}
              - {label: "Timer", value: "Timer"}
              - {label: "CD16", value: "CD16"}
              - {label: "Kalibrierungsdaten", value: "Kalibrierungsdaten"}
              - {label: "Alle Bereiche", value: "Alle"}

      aktion:
        name: Aktion
        description: >
          Löschen führt nur die Löschblöcke aus.
          Erzeugen führt nur die Erzeugungsblöcke aus.
          Neu erstellen führt zuerst Löschen und danach Erzeugen aus.
        required: true
        selector:
          select:
            options:
              - {label: "Erzeugen", value: "Erzeugen"}
              - {label: "Löschen", value: "Loeschen"}
              - {label: "Neu erstellen", value: "Neu_erstellen"}

    sequence:
      # ============================================================
      # 1. Auswahl / Prüfung
      # ============================================================
      - variables:
          speicher_auswahl: >-
            {% if speicher is defined and speicher | string | trim != '' %}
              {{ speicher }}
            {% else %}
              {{ states('input_select.speicherauswahl') }}
            {% endif %}

          bereich_auswahl: "{{ bereich | default('') | string | trim }}"
          aktion_auswahl: "{{ aktion | default('') | string | trim }}"

          gueltige_speicher:
            - b2500_01
            - b2500_02
            - b2500_03
            - b2500_04
            - b2500_05
            - b2500_06
            - b2500_07
            - b2500_08
            - b2500_09
            - Alle_Speicher

          gueltige_bereiche:
            - Hauptspeicher_Entitaeten
            - Spannungen
            - Timer
            - CD16
            - Kalibrierungsdaten
            - Alle

          gueltige_aktionen:
            - Erzeugen
            - Loeschen
            - Neu_erstellen

      - if:
          - condition: template
            value_template: "{{ speicher_auswahl not in gueltige_speicher }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_STORAGE
                message: Ungültige Speicherauswahl.
          - stop: Ungültige Speicherauswahl.
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ bereich_auswahl not in gueltige_bereiche }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_AREA
                message: Ungültiger Discovery-Bereich.
          - stop: Ungültiger Discovery-Bereich.
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ aktion_auswahl not in gueltige_aktionen }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_ACTION
                message: Ungültige Discovery-Aktion.
          - stop: Ungültige Discovery-Aktion.
            response_variable: response

      - variables:
          all_speicher: >-
            {% set raw = states('input_text.b2500_all') %}
            {% if raw not in ['unknown', 'unavailable', '', 'none', 'None'] %}
              {{ raw | from_json([]) }}
            {% else %}
              {{ [] }}
            {% endif %}

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

          do_delete: "{{ aktion_auswahl in ['Loeschen', 'Neu_erstellen'] }}"
          do_create: "{{ aktion_auswahl in ['Erzeugen', 'Neu_erstellen'] }}"

      - if:
          - condition: template
            value_template: "{{ targets | count == 0 }}"
        then:
          - variables:
              response:
                success: false
                code: NO_TARGETS
                message: Es wurden keine konfigurierten Speicher gefunden.
          - stop: Keine Ziel-Speicher gefunden.
            response_variable: response

      # ============================================================
      # 2. Speicher nacheinander bearbeiten
      # ============================================================
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - variables:
                current_storage: "{{ repeat.item }}"
                current_number: "{{ repeat.item[-2:] }}"
                current_typ: "{{ states('input_text.b' ~ repeat.item[-2:] ~ '_typ') }}"
                current_mac: "{{ states('input_text.b' ~ repeat.item[-2:] ~ '_mac') }}"

                # Rohabfragen werden pro Speicher und Durchlauf nur einmal
                # ausgeführt, wenn der gewählte Erzeugungsbereich sie benötigt.
                need_cd01: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'Hauptspeicher_Entitaeten',
                      'Spannungen',
                      'Timer',
                      'CD16',
                      'Alle'
                    ]
                  }}

                need_cd13: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'Spannungen',
                      'Alle'
                    ]
                  }}

                need_cd16: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'CD16',
                      'Alle'
                    ]
                  }}

                need_cd21: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'Kalibrierungsdaten',
                      'Alle'
                    ]
                  }}

                hauptspeicher_entities:
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit0
                    config: >-
                      {% raw %}{"name":"B01 Entladen","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l0=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[7] }}","default_entity_id":"sensor.b2500_01_l0_bit0","unique_id":"b2500_01_l0_bit0","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit1
                    config: >-
                      {% raw %}{"name":"B01 Laden","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l0=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[6] }}","default_entity_id":"sensor.b2500_01_l0_bit1","unique_id":"b2500_01_l0_bit1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit2
                    config: >-
                      {% raw %}{"name":"B01 DOD erreicht","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l0=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[5] }}","default_entity_id":"sensor.b2500_01_l0_bit2","unique_id":"b2500_01_l0_bit2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit3
                    config: >-
                      {% raw %}{"name":"B01 Unterspannung","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l0=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[4] }}","default_entity_id":"sensor.b2500_01_l0_bit3","unique_id":"b2500_01_l0_bit3","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit0
                    config: >-
                      {% raw %}{"name":"B01E2 Entladen","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[7] }}","default_entity_id":"sensor.b2500_01_l1_bit0","unique_id":"b2500_01_l1_bit0","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit1
                    config: >-
                      {% raw %}{"name":"B01E2 Laden","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[6] }}","default_entity_id":"sensor.b2500_01_l1_bit1","unique_id":"b2500_01_l1_bit1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit2
                    config: >-
                      {% raw %}{"name":"B01E2 DOD erreicht","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[5] }}","default_entity_id":"sensor.b2500_01_l1_bit2","unique_id":"b2500_01_l1_bit2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit3
                    config: >-
                      {% raw %}{"name":"B01E2 Unterspannung","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[4] }}","default_entity_id":"sensor.b2500_01_l1_bit3","unique_id":"b2500_01_l1_bit3","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit4
                    config: >-
                      {% raw %}{"name":"B01E1 Entladen","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[3] }}","default_entity_id":"sensor.b2500_01_l1_bit4","unique_id":"b2500_01_l1_bit4","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit5
                    config: >-
                      {% raw %}{"name":"B01E1 Laden","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[2] }}","default_entity_id":"sensor.b2500_01_l1_bit5","unique_id":"b2500_01_l1_bit5","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit6
                    config: >-
                      {% raw %}{"name":"B01E1 DOD erreicht","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[1] }}","default_entity_id":"sensor.b2500_01_l1_bit6","unique_id":"b2500_01_l1_bit6","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit7
                    config: >-
                      {% raw %}{"name":"B01E1 Unterspannung","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value.split('l1=')[1].split(',')[0] | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[0] }}","default_entity_id":"sensor.b2500_01_l1_bit7","unique_id":"b2500_01_l1_bit7","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: b1
                    component: binary_sensor
                    topic_suffix: b1
                    config: >-
                      {% raw %}{"name":"B01 E1 verbunden","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ value.split('b1=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_b1","unique_id":"b2500_01_b1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: b2
                    component: binary_sensor
                    topic_suffix: b2
                    config: >-
                      {% raw %}{"name":"B01 E2 verbunden","state_topic":"B2500PKG/B2500_01/CD01","payload_on":"1","payload_off":"0","value_template":"{{ value.split('b2=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_b2","unique_id":"b2500_01_b2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: p1
                    component: sensor
                    topic_suffix: p1
                    config: >-
                      {% raw %}{"name":"B01 Solar1 Input Status","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('p1=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_p1","unique_id":"b2500_01_p1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: p2
                    component: sensor
                    topic_suffix: p2
                    config: >-
                      {% raw %}{"name":"B01 Solar2 Input Status","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('p2=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_p2","unique_id":"b2500_01_p2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: w1
                    component: sensor
                    topic_suffix: w1
                    config: >-
                      {% raw %}{"name":"B01 PV1 Leistung","state_topic":"B2500PKG/B2500_01/CD01","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('w1=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_w1","unique_id":"b2500_01_w1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: w2
                    component: sensor
                    topic_suffix: w2
                    config: >-
                      {% raw %}{"name":"B01 PV2 Leistung","state_topic":"B2500PKG/B2500_01/CD01","state_class":"measurement","device_class":"power","unit_of_measurement":"W","value_template":"{{ value.split('w2=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_w2","unique_id":"b2500_01_w2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: pe
                    component: sensor
                    topic_suffix: pe
                    config: >-
                      {% raw %}{"name":"B01 Batterie SOC","state_topic":"B2500PKG/B2500_01/CD01","state_class":"measurement","device_class":"battery","unit_of_measurement":"%","value_template":"{{ value.split('pe=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_pe","unique_id":"b2500_01_pe","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: vv
                    component: sensor
                    topic_suffix: vv
                    config: >-
                      {% raw %}{"name":"B01 Geräteversion","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('vv=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_vv","unique_id":"b2500_01_vv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sv
                    component: sensor
                    topic_suffix: sv
                    config: >-
                      {% raw %}{"name":"B01 Gerätesubversion","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('sv=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_sv","unique_id":"b2500_01_sv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cs
                    component: sensor
                    topic_suffix: cs
                    config: >-
                      {% raw %}{"name":"B01 Ladeeinstellung","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('cs=')[1].split(',')[0].replace('0','Laden und Entladen gleichzeitig').replace('1','Laden vor dem Entladen') }}","default_entity_id":"sensor.b2500_01_cs","unique_id":"b2500_01_cs","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cd
                    component: sensor
                    topic_suffix: cd
                    config: >-
                      {% raw %}{"name":"B01 Entladeeinstellung","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{% set parts = value.split('cd=') %}{% if parts | length > 1 %}{% set cd = parts[1].split(',')[0] %}{% if cd == '0' %}Ausgang PV1 und PV2 off{% elif cd == '1' %}Ausgang PV1 on, PV2 off{% elif cd == '2' %}Ausgang PV1 off, PV2 on{% elif cd == '3' %}Ausgang PV1 und PV2 on{% else %}unbekannt{% endif %}{% else %}unbekannt{% endif %}","default_entity_id":"sensor.b2500_01_cd","unique_id":"b2500_01_cd","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: am
                    component: sensor
                    topic_suffix: am
                    config: >-
                      {% raw %}{"name":"B01 AM","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('am=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_am","unique_id":"b2500_01_am","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: o1
                    component: sensor
                    topic_suffix: o1
                    config: >-
                      {% raw %}{"name":"B01 Output Status 1","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('o1=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_o1","unique_id":"b2500_01_o1","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: o2
                    component: sensor
                    topic_suffix: o2
                    config: >-
                      {% raw %}{"name":"B01 Output Status 2","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('o2=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_o2","unique_id":"b2500_01_o2","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: do
                    component: sensor
                    topic_suffix: do
                    config: >-
                      {% raw %}{"name":"B01 DOD Entnehmbare Kapazität in %","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('do=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_do","unique_id":"b2500_01_do","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lv
                    component: sensor
                    topic_suffix: lv
                    config: >-
                      {% raw %}{"name":"B01 Entladeschwelle","state_topic":"B2500PKG/B2500_01/CD01","value_template":"{{ value.split('lv=')[1].split(',')[0] }}","default_entity_id":"sensor.b2500_01_lv","unique_id":"b2500_01_lv","entity_category":"diagnostic","device":{"identifiers":["b2500_01"],"name":"B2500 B01","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cj
                    component: sensor
