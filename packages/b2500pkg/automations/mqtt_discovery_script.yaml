script:
  b2500pkg_discovery_script:
    alias: B2500PKG_Discovery_Script
    description: >
      Verwaltet die MQTT-Discovery-Entitäten der B2500-Speicher.
      Speicher, Bereich und Aktion können gezielt ausgewählt werden.
      Unterstützt Erzeugen, Löschen und Neuerstellen einzelner
      Discovery-Bereiche sowie aller konfigurierten Speicher.

    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: "b2500_01"
        selector:
          select:
            options:
              - {label: "B01", value: "b2500_01"}
              - {label: "B02", value: "b2500_02"}
              - {label: "B03", value: "b2500_03"}
              - {label: "B04", value: "b2500_04"}
              - {label: "B05", value: "b2500_05"}
              - {label: "B06", value: "b2500_06"}
              - {label: "B07", value: "b2500_07"}
              - {label: "B08", value: "b2500_08"}
              - {label: "B09", value: "b2500_09"}
              - {label: "Alle Speicher", value: "Alle_Speicher"}

      bereich:
        name: Bereich
        description: Discovery-Bereich, der bearbeitet werden soll.
        required: true
        selector:
          select:
            options:
              - {label: "CD01 Statistik", value: "CD01_Statistik"}
              - {label: "CD01 optional", value: "CD01_Optional"}
              - {label: "CD16 Statistik", value: "CD16_Statistik"}
              - {label: "CD16 optional", value: "CD16_Optional"}
              - {label: "Spannungen", value: "Spannungen"}
              - {label: "Timer", value: "Timer"}
              - {label: "Kalibrierungsdaten", value: "Kalibrierungsdaten"}
              - {label: "Alle Bereiche", value: "Alle"}

      aktion:
        name: Aktion
        description: >
          Löschen führt nur die Löschblöcke aus.
          Erzeugen führt nur die Erzeugungsblöcke aus.
          Neu erstellen führt zuerst Löschen und danach Erzeugen aus.
        required: true
        selector:
          select:
            options:
              - {label: "Erzeugen", value: "Erzeugen"}
              - {label: "Löschen", value: "Loeschen"}
              - {label: "Neu erstellen", value: "Neu_erstellen"}

    sequence:
      # ============================================================
      # 1. Auswahl / Prüfung
      # ============================================================
      - variables:
          speicher_auswahl: >-
            {% if speicher is defined and speicher | string | trim != '' %}
              {{ speicher }}
            {% else %}
              {{ states('input_select.speicherauswahl') }}
            {% endif %}

          bereich_auswahl: "{{ bereich | default('') | string | trim }}"
          aktion_auswahl: "{{ aktion | default('') | string | trim }}"

          gueltige_speicher:
            - b2500_01
            - b2500_02
            - b2500_03
            - b2500_04
            - b2500_05
            - b2500_06
            - b2500_07
            - b2500_08
            - b2500_09
            - Alle_Speicher

          gueltige_bereiche:
            - CD01_Statistik
            - CD01_Optional
            - CD16_Statistik
            - CD16_Optional
            - Spannungen
            - Timer
            - Kalibrierungsdaten
            - Alle

          gueltige_aktionen:
            - Erzeugen
            - Loeschen
            - Neu_erstellen

      - if:
          - condition: template
            value_template: "{{ speicher_auswahl not in gueltige_speicher }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_STORAGE
                message: Ungültige Speicherauswahl.
          - stop: Ungültige Speicherauswahl.
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ bereich_auswahl not in gueltige_bereiche }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_AREA
                message: Ungültiger Discovery-Bereich.
          - stop: Ungültiger Discovery-Bereich.
            response_variable: response

      - if:
          - condition: template
            value_template: "{{ aktion_auswahl not in gueltige_aktionen }}"
        then:
          - variables:
              response:
                success: false
                code: INVALID_ACTION
                message: Ungültige Discovery-Aktion.
          - stop: Ungültige Discovery-Aktion.
            response_variable: response

      - variables:
          all_speicher: >-
            {% set raw = states('input_text.b2500_all') %}
            {% if raw not in ['unknown', 'unavailable', '', 'none', 'None'] %}
              {{ raw | from_json([]) }}
            {% else %}
              {{ [] }}
            {% endif %}

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

          do_delete: "{{ aktion_auswahl in ['Loeschen', 'Neu_erstellen'] }}"
          do_create: "{{ aktion_auswahl in ['Erzeugen', 'Neu_erstellen'] }}"

      - if:
          - condition: template
            value_template: "{{ targets | count == 0 }}"
        then:
          - variables:
              response:
                success: false
                code: NO_TARGETS
                message: Es wurden keine konfigurierten Speicher gefunden.
          - stop: Keine Ziel-Speicher gefunden.
            response_variable: response

      # Statusfenster für diesen Discovery-Lauf neu beginnen
      - event: b2500pkg_status
        event_data:
          status: LAEUFT
          titel: B2500PKG Discovery
          untertitel: >-
            {{ speicher_auswahl }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
          meldung: Discovery läuft
          details: ""
          rueckmeldung: ""
          adresse: ""
          quelle: script.b2500pkg_discovery_script

      # ============================================================
      # 2. Speicher nacheinander bearbeiten
      # ============================================================
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - variables:
                current_storage: "{{ repeat.item }}"
                current_number: "{{ repeat.item[-2:] }}"
                current_typ: "{{ states('input_text.b' ~ repeat.item[-2:] ~ '_typ') }}"
                current_mac: "{{ states('input_text.b' ~ repeat.item[-2:] ~ '_mac') }}"

                # Rohabfragen werden pro Speicher und Durchlauf nur einmal
                # ausgeführt, wenn der gewählte Erzeugungsbereich sie benötigt.
                need_cd01: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'CD01_Statistik',
                      'CD01_Optional',
                      'Spannungen',
                      'Timer',
                      'CD16_Statistik',
                      'CD16_Optional',
                      'Alle'
                    ]
                  }}

                need_cd13: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'Spannungen',
                      'Alle'
                    ]
                  }}

                need_cd16: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'CD16_Statistik',
                      'CD16_Optional',
                      'Alle'
                    ]
                  }}

                need_cd21: >-
                  {{
                    do_create and
                    bereich_auswahl in [
                      'Kalibrierungsdaten',
                      'Alle'
                    ]
                  }}

                cd01_optional_entities:
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit0
                    config: >-
                      {% raw %}{"name":"Entladen","state_topic":"B2500PKG/B2500_§§/CD01/l0","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[7] }}","default_entity_id":"sensor.b2500_§§_l0_bit0","unique_id":"b2500_§§_l0_bit0","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit1
                    config: >-
                      {% raw %}{"name":"Laden","state_topic":"B2500PKG/B2500_§§/CD01/l0","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[6] }}","default_entity_id":"sensor.b2500_§§_l0_bit1","unique_id":"b2500_§§_l0_bit1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit2
                    config: >-
                      {% raw %}{"name":"DOD erreicht","state_topic":"B2500PKG/B2500_§§/CD01/l0","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[5] }}","default_entity_id":"sensor.b2500_§§_l0_bit2","unique_id":"b2500_§§_l0_bit2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l0
                    component: binary_sensor
                    topic_suffix: l0_bit3
                    config: >-
                      {% raw %}{"name":"Unterspannung","state_topic":"B2500PKG/B2500_§§/CD01/l0","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[4] }}","default_entity_id":"sensor.b2500_§§_l0_bit3","unique_id":"b2500_§§_l0_bit3","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit0
                    config: >-
                      {% raw %}{"name":"E2 Entladen","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[7] }}","default_entity_id":"sensor.b2500_§§_l1_bit0","unique_id":"b2500_§§_l1_bit0","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit1
                    config: >-
                      {% raw %}{"name":"E2 Laden","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[6] }}","default_entity_id":"sensor.b2500_§§_l1_bit1","unique_id":"b2500_§§_l1_bit1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit2
                    config: >-
                      {% raw %}{"name":"E2 DOD erreicht","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[5] }}","default_entity_id":"sensor.b2500_§§_l1_bit2","unique_id":"b2500_§§_l1_bit2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit3
                    config: >-
                      {% raw %}{"name":"E2 Unterspannung","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[4] }}","default_entity_id":"sensor.b2500_§§_l1_bit3","unique_id":"b2500_§§_l1_bit3","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit4
                    config: >-
                      {% raw %}{"name":"E1 Entladen","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[3] }}","default_entity_id":"sensor.b2500_§§_l1_bit4","unique_id":"b2500_§§_l1_bit4","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit5
                    config: >-
                      {% raw %}{"name":"E1 Laden","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[2] }}","default_entity_id":"sensor.b2500_§§_l1_bit5","unique_id":"b2500_§§_l1_bit5","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit6
                    config: >-
                      {% raw %}{"name":"E1 DOD erreicht","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[1] }}","default_entity_id":"sensor.b2500_§§_l1_bit6","unique_id":"b2500_§§_l1_bit6","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: l1
                    component: binary_sensor
                    topic_suffix: l1_bit7
                    config: >-
                      {% raw %}{"name":"E1 Unterspannung","state_topic":"B2500PKG/B2500_§§/CD01/l1","payload_on":"1","payload_off":"0","value_template":"{{ ('{:0=8b}'.format(value | int(0) )|batch(1)|map('join')|join(' ')).split(' ')[0] }}","default_entity_id":"sensor.b2500_§§_l1_bit7","unique_id":"b2500_§§_l1_bit7","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: b1
                    component: binary_sensor
                    topic_suffix: b1
                    config: >-
                      {% raw %}{"name":"E1 verbunden","state_topic":"B2500PKG/B2500_§§/CD01/b1","payload_on":"1","payload_off":"0","default_entity_id":"sensor.b2500_§§_b1","unique_id":"b2500_§§_b1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: b2
                    component: binary_sensor
                    topic_suffix: b2
                    config: >-
                      {% raw %}{"name":"E2 verbunden","state_topic":"B2500PKG/B2500_§§/CD01/b2","payload_on":"1","payload_off":"0","default_entity_id":"sensor.b2500_§§_b2","unique_id":"b2500_§§_b2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: p1
                    component: sensor
                    topic_suffix: p1
                    config: >-
                      {% raw %}{"name":"Solar1 Input Status","state_topic":"B2500PKG/B2500_§§/CD01/p1","default_entity_id":"sensor.b2500_§§_p1","unique_id":"b2500_§§_p1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: p2
                    component: sensor
                    topic_suffix: p2
                    config: >-
                      {% raw %}{"name":"Solar2 Input Status","state_topic":"B2500PKG/B2500_§§/CD01/p2","default_entity_id":"sensor.b2500_§§_p2","unique_id":"b2500_§§_p2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: vv
                    component: sensor
                    topic_suffix: vv
                    config: >-
                      {% raw %}{"name":"Geräteversion","state_topic":"B2500PKG/B2500_§§/CD01/vv","default_entity_id":"sensor.b2500_§§_vv","unique_id":"b2500_§§_vv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sv
                    component: sensor
                    topic_suffix: sv
                    config: >-
                      {% raw %}{"name":"Gerätesubversion","state_topic":"B2500PKG/B2500_§§/CD01/sv","default_entity_id":"sensor.b2500_§§_sv","unique_id":"b2500_§§_sv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cs
                    component: sensor
                    topic_suffix: cs
                    config: >-
                      {% raw %}{"name":"Ladeeinstellung","state_topic":"B2500PKG/B2500_§§/CD01/cs","value_template":"{{ value.replace('0','Laden und Entladen gleichzeitig').replace('1','Laden vor dem Entladen') }}","default_entity_id":"sensor.b2500_§§_cs","unique_id":"b2500_§§_cs","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cd
                    component: sensor
                    topic_suffix: cd
                    config: >-
                      {% raw %}{"name":"Entladeeinstellung","state_topic":"B2500PKG/B2500_§§/CD01/cd","value_template":"{% set cd = value | string %}{% if cd == '0' %}Ausgang PV1 und PV2 off{% elif cd == '1' %}Ausgang PV1 on, PV2 off{% elif cd == '2' %}Ausgang PV1 off, PV2 on{% elif cd == '3' %}Ausgang PV1 und PV2 on{% else %}unbekannt{% endif %}","default_entity_id":"sensor.b2500_§§_cd","unique_id":"b2500_§§_cd","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: am
                    component: sensor
                    topic_suffix: am
                    config: >-
                      {% raw %}{"name":"AM","state_topic":"B2500PKG/B2500_§§/CD01/am","default_entity_id":"sensor.b2500_§§_am","unique_id":"b2500_§§_am","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: o1
                    component: sensor
                    topic_suffix: o1
                    config: >-
                      {% raw %}{"name":"Output Status 1","state_topic":"B2500PKG/B2500_§§/CD01/o1","default_entity_id":"sensor.b2500_§§_o1","unique_id":"b2500_§§_o1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: o2
                    component: sensor
                    topic_suffix: o2
                    config: >-
                      {% raw %}{"name":"Output Status 2","state_topic":"B2500PKG/B2500_§§/CD01/o2","default_entity_id":"sensor.b2500_§§_o2","unique_id":"b2500_§§_o2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: do
                    component: sensor
                    topic_suffix: do
                    config: >-
                      {% raw %}{"name":"DOD Entnehmbare Kapazität in %","state_topic":"B2500PKG/B2500_§§/CD01/do","default_entity_id":"sensor.b2500_§§_do","unique_id":"b2500_§§_do","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lv
                    component: sensor
                    topic_suffix: lv
                    config: >-
                      {% raw %}{"name":"Entladeschwelle","state_topic":"B2500PKG/B2500_§§/CD01/lv","default_entity_id":"sensor.b2500_§§_lv","unique_id":"b2500_§§_lv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: cj
                    component: sensor
                    topic_suffix: cj
                    config: >-
                      {% raw %}{"name":"CJ Scene","state_topic":"B2500PKG/B2500_§§/CD01/cj","default_entity_id":"sensor.b2500_§§_cj","unique_id":"b2500_§§_cj","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: kn
                    component: sensor
                    topic_suffix: kn
                    config: >-
                      {% raw %}{"name":"Gesamtkapazität","state_topic":"B2500PKG/B2500_§§/CD01/kn","device_class":"energy_storage","state_class":"measurement","unit_of_measurement":"Wh","default_entity_id":"sensor.b2500_§§_kn","unique_id":"b2500_§§_kn","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: tl
                    component: sensor
                    topic_suffix: tl
                    config: >-
                      {% raw %}{"name":"Temperatur low","state_topic":"B2500PKG/B2500_§§/CD01/tl","device_class":"temperature","unit_of_measurement":"°C","default_entity_id":"sensor.b2500_§§_tl","unique_id":"b2500_§§_tl","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: th
                    component: sensor
                    topic_suffix: th
                    config: >-
                      {% raw %}{"name":"Temperatur high","state_topic":"B2500PKG/B2500_§§/CD01/th","device_class":"temperature","unit_of_measurement":"°C","default_entity_id":"sensor.b2500_§§_th","unique_id":"b2500_§§_th","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: tc
                    component: sensor
                    topic_suffix: tc
                    config: >-
                      {% raw %}{"name":"Temperaturalarm (Laden)","state_topic":"B2500PKG/B2500_§§/CD01/tc","default_entity_id":"sensor.b2500_§§_tc","unique_id":"b2500_§§_tc","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: tf
                    component: sensor
