                      {% raw %}{"name":"Akku Power","state_topic":"B2500PKG/B2500_§§/CD16/bb","state_class":"measurement","device_class":"power","unit_of_measurement":"W","default_entity_id":"sensor.b2500_§§_cd16bb","unique_id":"b2500_§§_cd16bb","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: bv
                    topic_suffix: cd16bv
                    config: >-
                      {% raw %}{"name":"Akku Voltage","state_topic":"B2500PKG/B2500_§§/CD16/bv","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16bv","unique_id":"b2500_§§_cd16bv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: bc
                    topic_suffix: cd16bc
                    config: >-
                      {% raw %}{"name":"Akku Current","state_topic":"B2500PKG/B2500_§§/CD16/bc","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16bc","unique_id":"b2500_§§_cd16bc","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  - source_key: g1
                    topic_suffix: cd16g1
                    config: >-
                      {% raw %}{"name":"Output1 Leistung","state_topic":"B2500PKG/B2500_§§/CD16/g1","state_class":"measurement","device_class":"power","unit_of_measurement":"W","default_entity_id":"sensor.b2500_§§_cd16g1","unique_id":"b2500_§§_cd16g1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: i1
                    topic_suffix: cd16i1
                    config: >-
                      {% raw %}{"name":"Output1 Voltage","state_topic":"B2500PKG/B2500_§§/CD16/i1","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16i1","unique_id":"b2500_§§_cd16i1","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: c3
                    topic_suffix: cd16c3
                    config: >-
                      {% raw %}{"name":"Output1 Current","state_topic":"B2500PKG/B2500_§§/CD16/c3","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16c3","unique_id":"b2500_§§_cd16c3","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  - source_key: g2
                    topic_suffix: cd16g2
                    config: >-
                      {% raw %}{"name":"Output2 Leistung","state_topic":"B2500PKG/B2500_§§/CD16/g2","state_class":"measurement","device_class":"power","unit_of_measurement":"W","default_entity_id":"sensor.b2500_§§_cd16g2","unique_id":"b2500_§§_cd16g2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: i2
                    topic_suffix: cd16i2
                    config: >-
                      {% raw %}{"name":"Output2 Voltage","state_topic":"B2500PKG/B2500_§§/CD16/i2","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16i2","unique_id":"b2500_§§_cd16i2","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: c4
                    topic_suffix: cd16c4
                    config: >-
                      {% raw %}{"name":"Output2 Current","state_topic":"B2500PKG/B2500_§§/CD16/c4","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16c4","unique_id":"b2500_§§_cd16c4","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  # ------------------------------------------------
                  # Erweiterungsakku E1: nur erzeugen, wenn CD01 b1=1
                  # ------------------------------------------------
                  - source_key: sb
                    topic_suffix: cd16sb
                    extension: 1
                    config: >-
                      {% raw %}{"name":"E1 Akku Power","state_topic":"B2500PKG/B2500_§§/CD16/sb","state_class":"measurement","device_class":"power","unit_of_measurement":"W","default_entity_id":"sensor.b2500_§§_cd16sb","unique_id":"b2500_§§_cd16sb","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sv
                    topic_suffix: cd16sv
                    extension: 1
                    config: >-
                      {% raw %}{"name":"E1 Akku Voltage","state_topic":"B2500PKG/B2500_§§/CD16/sv","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16sv","unique_id":"b2500_§§_cd16sv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: sc
                    topic_suffix: cd16sc
                    extension: 1
                    config: >-
                      {% raw %}{"name":"E1 Akku Current","state_topic":"B2500PKG/B2500_§§/CD16/sc","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16sc","unique_id":"b2500_§§_cd16sc","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                  # ------------------------------------------------
                  # Erweiterungsakku E2: nur erzeugen, wenn CD01 b2=1
                  # ------------------------------------------------
                  - source_key: lb
                    topic_suffix: cd16lb
                    extension: 2
                    config: >-
                      {% raw %}{"name":"E2 Akku Power","state_topic":"B2500PKG/B2500_§§/CD16/lb","state_class":"measurement","device_class":"power","unit_of_measurement":"W","default_entity_id":"sensor.b2500_§§_cd16lb","unique_id":"b2500_§§_cd16lb","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lv
                    topic_suffix: cd16lv
                    extension: 2
                    config: >-
                      {% raw %}{"name":"E2 Akku Voltage","state_topic":"B2500PKG/B2500_§§/CD16/lv","state_class":"measurement","device_class":"voltage","unit_of_measurement":"V","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16lv","unique_id":"b2500_§§_cd16lv","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: lc
                    topic_suffix: cd16lc
                    extension: 2
                    config: >-
                      {% raw %}{"name":"E2 Akku Current","state_topic":"B2500PKG/B2500_§§/CD16/lc","state_class":"measurement","device_class":"current","unit_of_measurement":"A","value_template":"{{ (value | float) / 1000 }}","default_entity_id":"sensor.b2500_§§_cd16lc","unique_id":"b2500_§§_cd16lc","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

                calibration_entities:
                  - source_key: cf
                    topic_suffix: cd21cf
                    config: >-
                      {% raw %}{"name":"Kalibrierung Laden","state_topic":"B2500PKG/B2500_§§/CD21/cf","unit_of_measurement":"Ah","state_class":"measurement","suggested_display_precision":2,"value_template":"{{ (value | float) / 1000000 }}","default_entity_id":"sensor.b2500_§§_cd21cf","unique_id":"b2500_§§_cd21cf","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}
                  - source_key: df
                    topic_suffix: cd21df
                    config: >-
                      {% raw %}{"name":"Kalibrierung Entladen","state_topic":"B2500PKG/B2500_§§/CD21/df","unit_of_measurement":"Ah","state_class":"measurement","suggested_display_precision":2,"value_template":"{{ (value | float) / 1000000 }}","default_entity_id":"sensor.b2500_§§_cd21df","unique_id":"b2500_§§_cd21df","entity_category":"diagnostic","device":{"identifiers":["b2500_§§"],"name":"B§§","manufacturer":"B2500PKG","model":"B2500PKG_TYP","serial_number":"B2500PKG_MAC"}}{% endraw %}

            # ======================================================
            # ZENTRALE DATENAKTUALISIERUNG
            #
            # Bei Neu_erstellen bewusst VOR dem Löschen.
            # Jedes benötigte Dictionary (CD01/CD13/CD16/CD21)
            # wird pro Speicher nur einmal frisch angefordert.
            # ======================================================
            - variables:
                cd01_payload: ""
                cd13_payload: ""
                cd16_payload: ""
                cd21_payload: ""

            - if:
                - condition: template
                  value_template: "{{ need_cd01 }}"
              then:
                # Altes retained Dictionary entfernen, damit nur
                # die neue Antwort als Grundlage verwendet wird.
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD01"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=01"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                # Das CD01-Dictionary-Topic ist retained. Nach Abschluss des
                # Workers liefert die Subscription sofort den frisch
                # geschriebenen Datensatz.
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD01"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd01_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd13 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD13"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=13"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD13"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd13_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd16 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD16"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=16"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD16"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd16_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            - if:
                - condition: template
                  value_template: "{{ need_cd21 }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: "B2500PKG/B2500_{{ current_number }}/CD21"
                    payload: ""
                    retain: true

                - action: "script.{{ current_storage }}_worker"
                  data:
                    payload: "cd=21"
                    followup_payload: ""
                    no_check: false
                    expected_answer: {}

                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "B2500PKG/B2500_{{ current_number }}/CD21"
                  timeout: "00:00:02"
                  continue_on_timeout: true

                - variables:
                    cd21_payload: >-
                      {% if wait.trigger is not none %}
                        {{ wait.trigger.payload | string }}
                      {% else %}
                        {{ '' }}
                      {% endif %}

            # Vollständige Reposts liegen als JSON-Dictionaries vor.
            # Die Discovery prüft die vorhandenen Keys direkt darin.
            - variables:
                cd01_dict: >-
                  {% if cd01_payload is mapping %}
                    {{ cd01_payload }}
                  {% else %}
                    {{ cd01_payload | from_json({}) }}
                  {% endif %}

                cd13_dict: >-
                  {% if cd13_payload is mapping %}
                    {{ cd13_payload }}
                  {% else %}
                    {{ cd13_payload | from_json({}) }}
                  {% endif %}

                cd16_dict: >-
                  {% if cd16_payload is mapping %}
                    {{ cd16_payload }}
                  {% else %}
                    {{ cd16_payload | from_json({}) }}
                  {% endif %}

                cd21_dict: >-
                  {% if cd21_payload is mapping %}
                    {{ cd21_payload }}
                  {% else %}
                    {{ cd21_payload | from_json({}) }}
                  {% endif %}

            # Erweiterungsspeicher werden ausschließlich über CD01
            # als vorhanden erkannt. CD13-Nullwerte allein reichen nicht.
            - variables:
                expansion1_present: >-
                  {{ cd01_dict.get('b1', '0') | int(0) == 1 }}
                expansion2_present: >-
                  {{ cd01_dict.get('b2', '0') | int(0) == 1 }}

            # ======================================================
            # LÖSCHEN
            # bei Aktion Loeschen oder Neu_erstellen
            # ======================================================
            - if:
                - condition: template
                  value_template: "{{ do_delete }}"
              then:

                # --------------------------------------------------
                # CD01 OPTIONAL LÖSCHEN
                # Enthält vorerst die komplette bisherige CD01-Haupt-Discovery
                # ohne die bereits getrennten Statistik-Entitäten.
                # Die Feinsortierung erfolgt später.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: >
                        {{ bereich_auswahl in ['CD01_Optional', 'Alle'] }}
                  then:
                    - repeat:
                        for_each: "{{ cd01_optional_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} CD01 optional ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD01 STATISTIK LÖSCHEN
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD01_Statistik', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd01_statistik_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} CD01 Statistik ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # SPANNUNGEN LÖSCHEN
                #
                # Hauptspeicher: a0 ... af
                # Erweiterung E1: b0 ... bf
                # Erweiterung E2: c0 ... cf
                #
                # Beim Löschen immer ALLE 48 bekannten Topics,
                # unabhängig davon, ob E1/E2 aktuell vorhanden sind.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Spannungen', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each:
                          - a0
                          - a1
                          - a2
                          - a3
                          - a4
                          - a5
                          - a6
                          - a7
                          - a8
                          - a9
                          - aa
                          - ab
                          - ac
                          - ad
                          - ae
                          - af
                          - b0
                          - b1
                          - b2
                          - b3
                          - b4
                          - b5
                          - b6
                          - b7
                          - b8
                          - b9
                          - ba
                          - bb
                          - bc
                          - bd
                          - be
                          - bf
                          - c0
                          - c1
                          - c2
                          - c3
                          - c4
                          - c5
                          - c6
                          - c7
                          - c8
                          - c9
                          - ca
                          - cb
                          - cc
                          - cd
                          - ce
                          - cf
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ repeat.item }}/config
                              payload: ""
                              retain: true

                    # Abgeleitete Spannungswerte ebenfalls vollständig löschen.
                    - repeat:
                        for_each:
                          - voltage_min
                          - voltage_min_cell
                          - voltage_max
                          - voltage_max_cell
                          - voltage_diff
                          - extern1_voltage_min
                          - extern1_voltage_min_cell
                          - extern1_voltage_max
                          - extern1_voltage_max_cell
                          - extern1_voltage_diff
                          - extern2_voltage_min
                          - extern2_voltage_min_cell
                          - extern2_voltage_max
                          - extern2_voltage_max_cell
                          - extern2_voltage_diff
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} Spannungen ........... OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # TIMER LÖSCHEN
                #
                # d1..d5  = Timer aktiv (binary_sensor)
                # e1..e5  = Beginn
                # f1..f5  = Ende
                # h1..h5  = Ausgabeleistung
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Timer', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each:
                          - 1
                          - 2
                          - 3
                          - 4
                          - 5
                        sequence:
                          - variables:
                              timer_slot: "{{ repeat.item }}"

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/binary_sensor/b2500_{{ current_number }}/d{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/e{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/f{{ timer_slot }}/config
                              payload: ""
                              retain: true

                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/h{{ timer_slot }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} Timer ................ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD16 STATISTIK LÖSCHEN
                # Bereich ist vorbereitet; aktuell noch keine Entitäten
                # zugeordnet.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16_Statistik', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_statistik_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} CD16 Statistik ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD16 OPTIONAL LÖSCHEN
                # Beim Löschen immer alle 23 definierten Topics:
                # 17 Hauptwerte inkl. p1/p2 + 6 optionale Erweiterungsakku-Werte.
                # Unabhängig davon, ob b1/b2 aktuell aktiv sind.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD16_Optional', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd16_optional_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} CD16 optional ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # KALIBRIERUNGSDATEN LÖSCHEN
                # cf / df immer vollständig entfernen.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Kalibrierungsdaten', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ calibration_entities }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: >-
                                homeassistant/sensor/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                              payload: ""
                              retain: true

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Lösche B{{ current_number }} Kalibrierung ......... OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

            # ======================================================
            # ERZEUGEN
            # bei Aktion Erzeugen oder Neu_erstellen
            # ======================================================
            - if:
                - condition: template
                  value_template: "{{ do_create }}"
              then:

                # --------------------------------------------------
                # CD01 OPTIONAL ERZEUGEN
                #
                # Enthält vorerst die bisherige CD01-Haupt-Discovery.
                # Die Entitäten werden später zwischen CD01 Statistik
                # und CD01 optional fein aufgeteilt.
                # --------------------------------------------------
                # Bei Neu_erstellen kurz warten, damit gelöschte MQTT-Discovery-Entitäten
                # aus dem Home-Assistant-State-Machine verschwinden, bevor die ID-Prüfung läuft.
                - if:
                    - condition: template
                      value_template: '{{ do_delete }}'
                  then:
                    - delay:
                        seconds: 1
                - if:
                    - condition: template
                      value_template: >
                        {{ bereich_auswahl in ['CD01_Optional', 'Alle'] }}
                  then:
                    - repeat:
                        for_each: "{{ cd01_optional_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ repeat.item.source_key in cd01_dict }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('§§', current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}

                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} CD01 optional ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # CD01 STATISTIK ERZEUGEN
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['CD01_Statistik', 'Alle'] }}"
                  then:
                    - repeat:
                        for_each: "{{ cd01_statistik_entities }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {% set ns = namespace(ok=true) %}
                                  {% for key in repeat.item.required_keys | default([]) %}
                                    {% if key not in cd01_dict %}
                                      {% set ns.ok = false %}
                                    {% endif %}
                                  {% endfor %}
                                  {{ ns.ok }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      (repeat.item.config | to_json)
                                      | replace('§§', current_number)
                                      | replace('"B2500PKG_TYP"', current_typ | to_json)
                                      | replace('"B2500PKG_MAC"', current_mac | to_json)
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/{{ repeat.item.component }}/b2500_{{ current_number }}/{{ repeat.item.topic_suffix }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}

                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script

                    - event: b2500pkg_status
                      event_data:
                        status: LAEUFT
                        titel: B2500PKG Discovery
                        untertitel: >-
                          B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                        meldung: Discovery läuft
                        details: "Erzeuge B{{ current_number }} CD01 Statistik ........ OK"
                        append: true
                        rueckmeldung: ""
                        adresse: ""
                        quelle: script.b2500pkg_discovery_script

                # --------------------------------------------------
                # SPANNUNGEN ERZEUGEN
                # Jede tatsächlich erzeugte Entität wird einzeln im Statusfenster protokolliert.
                #
                # CD01 liefert b1/b2 zur Erkennung der Erweiterungen.
                # CD13 liefert a0..af, b0..bf und c0..cf.
                #
                # Hauptspeicher:
                #   jeweiliges aX-Kürzel muss in CD13 vorhanden sein.
                #
                # E1:
                #   CD01 b1=1 UND jeweiliges bX-Kürzel in CD13.
                #
                # E2:
                #   CD01 b2=1 UND jeweiliges cX-Kürzel in CD13.
                # --------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ bereich_auswahl in ['Spannungen', 'Alle'] }}"
                  then:
                    # Hauptspeicher a0 ... af
                    - repeat:
                        for_each:
                          - key: a0
                            cell: "01"
                          - key: a1
                            cell: "02"
                          - key: a2
                            cell: "03"
                          - key: a3
                            cell: "04"
                          - key: a4
                            cell: "05"
                          - key: a5
                            cell: "06"
                          - key: a6
                            cell: "07"
                          - key: a7
                            cell: "08"
                          - key: a8
                            cell: "09"
                          - key: a9
                            cell: "10"
                          - key: aa
                            cell: "11"
                          - key: ab
                            cell: "12"
                          - key: ac
                            cell: "13"
                          - key: ad
                            cell: "14"
                          - key: ae
                            cell: "15"
                          - key: af
                            cell: "16"
                        sequence:
                          - variables:
                              voltage_key: "{{ repeat.item.key }}"
                              cell_number: "{{ repeat.item.cell }}"

                          - if:
                              - condition: template
                                value_template: >-
                                  {{ voltage_key in cd13_dict }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      {
                                        'name':
                                          'Zelle' ~ cell_number,
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD13/' ~ voltage_key,
                                        'device_class': 'voltage',
                                        'unit_of_measurement': 'mV',
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_zelle' ~ cell_number,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_zelle' ~ cell_number,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ voltage_key }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}


                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script
                    # Erweiterungen b0 ... bf / c0 ... cf
                    - repeat:
                        for_each:
                          - key: b0
                            extension: 1
                            cell: "01"
                          - key: b1
                            extension: 1
                            cell: "02"
                          - key: b2
                            extension: 1
                            cell: "03"
                          - key: b3
                            extension: 1
                            cell: "04"
                          - key: b4
                            extension: 1
                            cell: "05"
                          - key: b5
                            extension: 1
                            cell: "06"
                          - key: b6
                            extension: 1
                            cell: "07"
                          - key: b7
                            extension: 1
                            cell: "08"
                          - key: b8
                            extension: 1
                            cell: "09"
                          - key: b9
                            extension: 1
                            cell: "10"
                          - key: ba
                            extension: 1
                            cell: "11"
                          - key: bb
                            extension: 1
                            cell: "12"
                          - key: bc
                            extension: 1
                            cell: "13"
                          - key: bd
                            extension: 1
                            cell: "14"
                          - key: be
                            extension: 1
                            cell: "15"
                          - key: bf
                            extension: 1
                            cell: "16"
                          - key: c0
                            extension: 2
                            cell: "01"
                          - key: c1
                            extension: 2
                            cell: "02"
                          - key: c2
                            extension: 2
                            cell: "03"
                          - key: c3
                            extension: 2
                            cell: "04"
                          - key: c4
                            extension: 2
                            cell: "05"
                          - key: c5
                            extension: 2
                            cell: "06"
                          - key: c6
                            extension: 2
                            cell: "07"
                          - key: c7
                            extension: 2
                            cell: "08"
                          - key: c8
                            extension: 2
                            cell: "09"
                          - key: c9
                            extension: 2
                            cell: "10"
                          - key: ca
                            extension: 2
                            cell: "11"
                          - key: cb
                            extension: 2
                            cell: "12"
                          - key: cc
                            extension: 2
                            cell: "13"
                          - key: cd
                            extension: 2
                            cell: "14"
                          - key: ce
                            extension: 2
                            cell: "15"
                          - key: cf
                            extension: 2
                            cell: "16"
                        sequence:
                          - variables:
                              voltage_key: "{{ repeat.item.key }}"
                              extension_number: "{{ repeat.item.extension }}"
                              cell_number: "{{ repeat.item.cell }}"

                          - if:
                              - condition: template
                                value_template: >-
                                  {{
                                    voltage_key in cd13_dict and
                                    (
                                      (extension_number | int == 1 and expansion1_present) or
                                      (extension_number | int == 2 and expansion2_present)
                                    )
                                  }}
                            then:
                              - variables:
                                  discovery_payload: >-
                                    {{
                                      {
                                        'name':
                                          'E' ~ extension_number ~ ' Zelle' ~ cell_number,
                                        'state_topic':
                                          'B2500PKG/B2500_' ~ current_number ~ '/CD13/' ~ voltage_key,
                                        'device_class': 'voltage',
                                        'unit_of_measurement': 'mV',
                                        'default_entity_id':
                                          'sensor.b2500_' ~ current_number ~ '_extern' ~ extension_number ~ '_zelle' ~ cell_number,
                                        'unique_id':
                                          'b2500_' ~ current_number ~ '_extern' ~ extension_number ~ '_zelle' ~ cell_number,
                                        'entity_category': 'diagnostic',
                                        'device': {
                                          'identifiers': ['b2500_' ~ current_number],
                                          'name': 'B' ~ current_number,
                                          'manufacturer': 'B2500PKG',
                                          'model': current_typ,
                                          'serial_number': current_mac
                                        }
                                      } | to_json
                                    }}
                              - variables:
                                  discovery_entity_id: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                                  discovery_entity_name: >-
                                    {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                              - variables:
                                  discovery_entity_exists: >-
                                    {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                              - if:
                                  - condition: template
                                    value_template: '{{ not discovery_entity_exists }}'
                                then:
                                  - action: mqtt.publish
                                    data:
                                      topic: >-
                                        homeassistant/sensor/b2500_{{ current_number }}/voltage_{{ voltage_key }}/config
                                      retain: true
                                      payload: >-
                                        {{ discovery_payload }}



                              - event: b2500pkg_status
                                event_data:
                                  status: LAEUFT
                                  titel: B2500PKG Discovery
                                  untertitel: >-
                                    B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                                  meldung: Discovery läuft
                                  details: >-
                                    {% if discovery_entity_exists %}
                                      ⚠️ Übersprungen: {{ discovery_entity_name }} -> {{ discovery_entity_id }} bereits vorhanden
                                    {% else %}
                                      Erstelle {{ discovery_entity_name }} -> {{ discovery_entity_id }}
                                    {% endif %}
                                  append: true
                                  rueckmeldung: ""
                                  adresse: ""
                                  quelle: script.b2500pkg_discovery_script
                    # --------------------------------------------------
                    # HAUPTSPEICHER – Min/Max/Zellnummer/Spannungsdifferenz
                    # Trigger ist CD13/last_updated; die Berechnung liest
                    # danach den fertigen CD13-Cache des Geräts.
                    # --------------------------------------------------
                    - repeat:
                        for_each:
                          - suffix: voltage_min
                            name: "Minimale Zellspannung"
                            result: min
                            voltage: true
                          - suffix: voltage_min_cell
                            name: "Zelle Minimum"
                            result: min_cell
                            voltage: false
                          - suffix: voltage_max
                            name: "Maximale Zellspannung"
                            result: max
                            voltage: true
                          - suffix: voltage_max_cell
                            name: "Zelle Maximum"
                            result: max_cell
                            voltage: false
                          - suffix: voltage_diff
                            name: "Spannungsdifferenz"
                            result: diff
                            voltage: true
                        sequence:
                          - variables:
                              derived_suffix: "{{ repeat.item.suffix }}"
                              derived_name: "{{ repeat.item.name }}"
                              derived_result: "{{ repeat.item.result }}"
                              derived_is_voltage: "{{ repeat.item.voltage }}"
                              # Bestehendes Hauptspeicher-Namensschema beibehalten.
                              # Beispiel B01:
                              #   sensor.b01_min_spannung
                              #   sensor.b01_min_spannung_zelle
                              #   sensor.b01_max_spannung
                              #   sensor.b01_max_spannung_zelle
                              #   sensor.b01_spannungsdifferenz
                              derived_entity_id: >-
                                {% if repeat.item.suffix == 'voltage_min' %}
                                  sensor.b{{ current_number }}_min_spannung
                                {% elif repeat.item.suffix == 'voltage_min_cell' %}
                                  sensor.b{{ current_number }}_min_spannung_zelle
                                {% elif repeat.item.suffix == 'voltage_max' %}
                                  sensor.b{{ current_number }}_max_spannung
                                {% elif repeat.item.suffix == 'voltage_max_cell' %}
                                  sensor.b{{ current_number }}_max_spannung_zelle
                                {% elif repeat.item.suffix == 'voltage_diff' %}
                                  sensor.b{{ current_number }}_spannungsdifferenz
                                {% else %}
                                  sensor.b{{ current_number }}_{{ repeat.item.suffix }}
                                {% endif %}
                              derived_unique_id: >-
                                {% if repeat.item.suffix == 'voltage_min' %}
                                  b{{ current_number }}_min_spannung
                                {% elif repeat.item.suffix == 'voltage_min_cell' %}
                                  b{{ current_number }}_min_spannung_zelle
                                {% elif repeat.item.suffix == 'voltage_max' %}
                                  b{{ current_number }}_max_spannung
                                {% elif repeat.item.suffix == 'voltage_max_cell' %}
                                  b{{ current_number }}_max_spannung_zelle
                                {% elif repeat.item.suffix == 'voltage_diff' %}
                                  b{{ current_number }}_spannungsdifferenz
                                {% else %}
                                  b{{ current_number }}_{{ repeat.item.suffix }}
                                {% endif %}
                              derived_template: >-
                                {% set keys_literal = "['a0','a1','a2','a3','a4','a5','a6','a7','a8','a9','aa','ab','ac','ad']" %}
                                {% set common =
                                  "{% set data = state_attr('sensor.b2500_cache_§§', 'cd13') or {} %}"
                                  ~ "{% set keys = " ~ keys_literal ~ " %}"
                                  ~ "{% set ns = namespace(min=99999,min_cell=0,max=-1,max_cell=0,count=0) %}"
                                  ~ "{% for key in keys %}"
                                  ~ "{% set v = data.get(key,-1) | int(-1) %}"
                                  ~ "{% if v > 0 %}"
                                  ~ "{% set ns.count = ns.count + 1 %}"
                                  ~ "{% if v < ns.min %}{% set ns.min = v %}{% set ns.min_cell = loop.index %}{% endif %}"
                                  ~ "{% if v > ns.max %}{% set ns.max = v %}{% set ns.max_cell = loop.index %}{% endif %}"
                                  ~ "{% endif %}"
                                  ~ "{% endfor %}"
                                %}
                                {% if derived_result == 'min' %}
                                  {{ common ~ "{% if ns.count > 0 %}{{ ns.min }}{% else %}{{ none }}{% endif %}" }}
                                {% elif derived_result == 'min_cell' %}
                                  {{ common ~ "{% if ns.count > 0 %}{{ ns.min_cell }}{% else %}{{ none }}{% endif %}" }}
                                {% elif derived_result == 'max' %}
                                  {{ common ~ "{% if ns.count > 0 %}{{ ns.max }}{% else %}{{ none }}{% endif %}" }}
                                {% elif derived_result == 'max_cell' %}
                                  {{ common ~ "{% if ns.count > 0 %}{{ ns.max_cell }}{% else %}{{ none }}{% endif %}" }}
                                {% else %}
                                  {{ common ~ "{% if ns.count > 0 %}{{ ns.max - ns.min }}{% else %}{{ none }}{% endif %}" }}
                                {% endif %}

                          - variables:
                              discovery_payload: >-
                                {% if derived_is_voltage | bool %}
                                  {{
                                    {
                                      'name': derived_name,
                                      'state_topic':
                                        'B2500PKG/B2500_' ~ current_number ~ '/CD13/last_updated',
                                      'value_template': derived_template | replace('§§', current_number),
                                      'device_class': 'voltage',
                                      'state_class': 'measurement',
                                      'unit_of_measurement': 'mV',
                                      'default_entity_id':
                                        derived_entity_id,
                                      'unique_id':
                                        derived_unique_id,
                                      'entity_category': 'diagnostic',
                                      'device': {
                                        'identifiers': ['b2500_' ~ current_number],
                                        'name': 'B' ~ current_number,
                                        'manufacturer': 'B2500PKG',
                                        'model': current_typ,
                                        'serial_number': current_mac
                                      }
                                    } | to_json
                                  }}
                                {% else %}
                                  {{
                                    {
                                      'name': derived_name,
                                      'state_topic':
                                        'B2500PKG/B2500_' ~ current_number ~ '/CD13/last_updated',
                                      'value_template': derived_template | replace('§§', current_number),
                                      'default_entity_id':
                                        derived_entity_id,
                                      'unique_id':
                                        derived_unique_id,
                                      'entity_category': 'diagnostic',
                                      'device': {
                                        'identifiers': ['b2500_' ~ current_number],
                                        'name': 'B' ~ current_number,
                                        'manufacturer': 'B2500PKG',
                                        'model': current_typ,
                                        'serial_number': current_mac
                                      }
                                    } | to_json
                                  }}
                                {% endif %}
                          - variables:
                              discovery_entity_id: >-
                                {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('default_entity_id', '') | string | trim }}
                              discovery_entity_name: >-
                                {% set cfg = discovery_payload if discovery_payload is mapping else discovery_payload | from_json({}) %}{{ cfg.get('name', 'Unbekannt') | string | trim }}
                          - variables:
                              discovery_entity_exists: >-
                                {{ discovery_entity_id != '' and (expand(discovery_entity_id) | count > 0) }}
                          - if:
                              - condition: template
                                value_template: '{{ not discovery_entity_exists }}'
                            then:
                              - action: mqtt.publish
                                data:
                                  topic: >-
                                    homeassistant/sensor/b2500_{{ current_number }}/{{ derived_suffix }}/config
                                  retain: true
                                  payload: >-
                                    {{ discovery_payload }}


                          - event: b2500pkg_status
                            event_data:
                              status: LAEUFT
                              titel: B2500PKG Discovery
                              untertitel: >-
                                B{{ current_number }} – {{ aktion_auswahl }} – {{ bereich_auswahl }}
                              meldung: Discovery läuft
                              details: >-
                                {% if discovery_entity_exists %}
