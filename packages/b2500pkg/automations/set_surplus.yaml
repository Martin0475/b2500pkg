input_select:
  surplus:
    name: Surplus Modus
    options:
    - Überschusseinspeisung an
    - Überschusseinspeisung aus
script:
  b2500pkg_set_surplus:
    alias: B2500PKG_Set_Surplus
    description: Setzt den Surplus-/Überschusseinspeisungsmodus für einen oder alle B2500-Speicher. Leere Aktionsfelder verwenden die vorhandenen
      Input-Helper.
    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: b2500_01
        selector:
          select:
            options:
            - label: B01
              value: b2500_01
            - label: B02
              value: b2500_02
            - label: B03
              value: b2500_03
            - label: B04
              value: b2500_04
            - label: B05
              value: b2500_05
            - label: B06
              value: b2500_06
            - label: B07
              value: b2500_07
            - label: B08
              value: b2500_08
            - label: B09
              value: b2500_09
            - label: Alle Speicher
              value: Alle_Speicher
      surplus:
        name: Surplus-Modus
        description: Optional. Wenn leer, wird input_select.surplus verwendet.
        required: false
        example: Überschusseinspeisung an
        selector:
          select:
            options:
            - Überschusseinspeisung an
            - Überschusseinspeisung aus
    sequence:
    - variables:
        speicher_auswahl: "{% if speicher is defined and speicher | string | trim != '' %}\n  {{ speicher | string | trim }}\n{% else %}\n  {{\
          \ states('input_select.speicherauswahl') | string | trim }}\n{% endif %}"
        surplus_mode: "{% if surplus is defined and surplus | string | trim != '' %}\n  {{ surplus | string | trim }}\n{% else %}\n  {{ states('input_select.surplus')\
          \ | string | trim }}\n{% endif %}"
        surplus_value: "{% set raw = surplus_mode | string | trim %}\n{% if raw in ['Überschusseinspeisung an', '0'] %}\n  0\n{% elif raw in ['Überschusseinspeisung\
          \ aus', '1'] %}\n  1\n{% else %}\n  -1\n{% endif %}"
        surplus_name: "{% if surplus_value | int(-1) == 0 %}\n  Überschusseinspeisung an\n{% elif surplus_value | int(-1) == 1 %}\n  Überschusseinspeisung\
          \ aus\n{% else %}\n  Ungültig\n{% endif %}"
        surplus_payload: cd=31,touchuan_disa={{ surplus_value | int(-1) }}
        erlaubte_speicher:
        - b2500_01
        - b2500_02
        - b2500_03
        - b2500_04
        - b2500_05
        - b2500_06
        - b2500_07
        - b2500_08
        - b2500_09
        - Alle_Speicher
        all_speicher: "{% set raw = states('input_text.b2500_all') %}\n{% if raw not in ['unknown', 'unavailable', '', 'none', 'None'] %}\n  {{\
          \ raw | from_json([]) }}\n{% else %}\n  {{ [] }}\n{% endif %}"
        targets: "{% if speicher_auswahl == 'Alle_Speicher' %}\n  {{ all_speicher }}\n{% else %}\n  {{ [speicher_auswahl] }}\n{% endif %}"
    - if:
      - condition: template
        value_template: '{{ speicher_auswahl not in erlaubte_speicher or surplus_value | int(-1) not in [0, 1] or targets | count == 0 }}'
      then:
      - event: b2500pkg_status
        event_data:
          status: FEHLER
          titel: B2500PKG Surplus
          untertitel: '{{ speicher_auswahl }}'
          meldung: Ungültige Eingabe
          details: 'Surplus: {{ surplus_mode }}'
          rueckmeldung: 'Erwartet: Überschusseinspeisung an/aus oder roh 0/1.'
          adresse: script.b2500pkg_set_surplus
          quelle: script.b2500pkg_set_surplus
      - stop: Ungültige Surplus-Eingabe.
    - repeat:
        for_each: '{{ targets }}'
        sequence:
        - variables:
            current_storage: '{{ repeat.item }}'
            worker_entity: script.{{ repeat.item }}_worker
            worker_status_entity: input_number.b2500_{{ repeat.item[-2:] }}_status
        - event: b2500pkg_status
          event_data:
            status: LAEUFT
            titel: B2500PKG Surplus
            untertitel: '{{ current_storage | upper | replace(''B2500_'', ''B'') }} – {{ surplus_name }}'
            meldung: Surplus-Modus wird gesetzt
            details: Sende {{ surplus_payload }}
            rueckmeldung: Erwartet tc_dis={{ surplus_value | int }}
            adresse: '{{ worker_entity }}'
            quelle: script.b2500pkg_set_surplus
        - action: '{{ worker_entity }}'
          data:
            payload: '{{ surplus_payload }}'
            followup_payload: cd=01
            no_check: false
            expected_answer:
              tc_dis: '{{ surplus_value | int }}'
        - variables:
            worker_status: '{{ states(worker_status_entity) | int(0) }}'
        - event: b2500pkg_status
          event_data:
            status: '{{ ''ERFOLGREICH'' if worker_status == 3 else ''FEHLER'' }}'
            titel: B2500PKG Surplus
            untertitel: '{{ current_storage | upper | replace(''B2500_'', ''B'') }} – {{ surplus_name }}'
            meldung: '{{ ''Surplus-Modus bestätigt'' if worker_status == 3 else ''Surplus-Modus konnte nicht bestätigt werden'' }}'
            details: Erwartet tc_dis={{ surplus_value | int }}
            rueckmeldung: Worker-Status {{ worker_status }}
            adresse: '{{ worker_status_entity }}'
            quelle: script.b2500pkg_set_surplus
        - delay:
            seconds: 1
    mode: queued
    max: 10
    trace:
      stored_traces: 0
