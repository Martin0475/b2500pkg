input_select:
  surplus:
    name: Surplus Modus
    options:
      - "Überschusseinspeisung an"
      - "Überschusseinspeisung aus"

script:
  b2500pkg_set_surplus:
    alias: B2500PKG_Set_Surplus
    description: "Setzt den Surplus-/Überschusseinspeisungsmodus für einen oder alle B2500-Speicher. Leere Aktionsfelder verwenden die vorhandenen Input-Helper."

    fields:
      speicher:
        name: Speicher
        description: Optional. Wenn leer, wird input_select.speicherauswahl verwendet.
        required: false
        example: "b2500_01"
        selector:
          select:
            options:
              - label: "B01"
                value: "b2500_01"
              - label: "B02"
                value: "b2500_02"
              - label: "B03"
                value: "b2500_03"
              - label: "B04"
                value: "b2500_04"
              - label: "B05"
                value: "b2500_05"
              - label: "B06"
                value: "b2500_06"
              - label: "B07"
                value: "b2500_07"
              - label: "B08"
                value: "b2500_08"
              - label: "B09"
                value: "b2500_09"
              - label: "Alle Speicher"
                value: "Alle_Speicher"

      surplus:
        name: Surplus-Modus
        description: Optional. Wenn leer, wird input_select.surplus verwendet.
        required: false
        example: "Überschusseinspeisung an"
        selector:
          select:
            options:
              - "Überschusseinspeisung an"
              - "Überschusseinspeisung aus"

    sequence:
      - variables:
          speicher_auswahl: >-
            {% if speicher is defined and speicher | string | trim != '' %}
              {{ speicher }}
            {% else %}
              {{ states('input_select.speicherauswahl') }}
            {% endif %}

          surplus_mode: >-
            {% if surplus is defined and surplus | string | trim != '' %}
              {{ surplus }}
            {% else %}
              {{ states('input_select.surplus') }}
            {% endif %}

          surplus_value: >-
            {% if surplus_mode == 'Überschusseinspeisung an' %}
              0
            {% else %}
              1
            {% endif %}

          surplus_expected: >-
            {% if surplus_mode == 'Überschusseinspeisung an' %}
              Surplus Modus aktiv
            {% else %}
              Surplus Modus deaktiviert
            {% endif %}

          surplus_payload: "cd=31,touchuan_disa={{ surplus_value | int }}"
          all_speicher: "{{ states('input_text.b2500_all') | from_json }}"

          targets: >-
            {% if speicher_auswahl == 'Alle_Speicher' %}
              {{ all_speicher }}
            {% else %}
              {{ [speicher_auswahl] }}
            {% endif %}

      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: "script.{{ repeat.item }}_worker"
              data:
                variables:
                  payload: "{{ surplus_payload }}"
                  followup_payload: "cd=01"
                  no_check: false
                  expected_answer:
                    tc_dis: "{{ surplus_expected }}"

            - delay:
                seconds: 1

    mode: queued
    max: 10
