template:
  - sensor:
      - name: "B2500 Status Zeile"
        unique_id: b2500_status_zeile
        state: >
          {% set raw = states('input_text.b2500_all') %}
          {% set result = namespace(items=[]) %}

          {% if raw in ['unknown','unavailable','none',''] or not raw.startswith('[') %}
            Keine Speicher
          {% else %}
            {% set speicher = raw | from_json %}
            
            {% for item in speicher %}
              {% set num = item.split('_')[-1] %}
              {% set entity = 'input_number.b2500_' ~ num ~ '_status' %}
              {% set val = states(entity) %}

              {% if val in ['unknown','unavailable','none',''] %}
                {% set icon = "⚫" %}
              {% else %}
                {% set v = val | int(-99) %}
                {% if v == -1 %}
                  {% set icon = "🔴" %}
                {% elif v == 0 %}
                  {% set icon = "⚫" %}
                {% elif v == 1 %}
                  {% set icon = "🟡" %}
                {% elif v == 2 %}
                  {% set icon = "🟠" %}
                {% elif v == 3 %}
                  {% set icon = "🟢" %}
                {% elif v == 4 %}
                  {% set icon = "🔵" %}
                {% else %}
                  {% set icon = "⚫" %}
                {% endif %}
              {% endif %}

              {% set result.items = result.items + ['B' ~ num ~ ' ' ~ icon] %}
            {% endfor %}

            {{ result.items | join(' | ') if result.items else 'Keine Speicher' }}
          {% endif %}

  - trigger:
      - platform: event
        event_type: b2500pkg_status
    sensor:
      - name: B2500PKG Status
        unique_id: b2500pkg_status
        icon: mdi:information-outline
        state: >-
          {{ trigger.event.data.status | default('INFO') }}
        attributes:
          titel: >-
            {{ trigger.event.data.titel | default('B2500PKG') }}
          untertitel: >-
            {{ trigger.event.data.untertitel | default('') }}
          meldung: >-
            {{ trigger.event.data.meldung | default('') }}
          details: >-
            {% set neu = trigger.event.data.details | default('') %}
            {% set anhaengen = trigger.event.data.append | default(false) %}
            {% if anhaengen %}
              {% set alt = this.attributes.get('details', '') | default('', true) %}
              {% if alt | trim %}
                {{ alt ~ '\n' ~ neu }}
              {% else %}
                {{ neu }}
              {% endif %}
            {% else %}
              {{ neu }}
            {% endif %}
          rueckmeldung: >-
            {{ trigger.event.data.rueckmeldung | default('') }}
          adresse: >-
            {{ trigger.event.data.adresse | default('') }}
          quelle: >-
            {{ trigger.event.data.quelle | default('') }}
