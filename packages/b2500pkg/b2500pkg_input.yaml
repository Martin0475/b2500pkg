input_text:
  b2500_all:
    name: B2500 All
    max: 255

input_select:
  speicherauswahl:
    name: Speicherauswahl
    options:
      - Alle_Speicher

  timerslot:
    name: Timer auswählen
    options:
      - 1
      - 2
      - 3
      - 4
      - 5
      - Alle_Timer

input_boolean:
  b2500_timer_ein:
    name: Timer einschalten
    icon: mdi:timer-check

  b2500_timer_aus:
    name: Timer ausschalten
    icon: mdi:timer-cancel

  b2500_timer_startzeit_aendern:
    name: Startzeit ändern
    icon: mdi:clock-start

  b2500_timer_endzeit_aendern:
    name: Endzeit ändern
    icon: mdi:clock-end

  b2500_timer_leistung_aendern:
    name: Leistung ändern
    icon: mdi:flash      

input_datetime:
  timer_beginn:
    name: Start
    has_date: false
    has_time: true
  timer_ende:
    name: Ende
    has_date: false
    has_time: true

input_number:
  timer_leistung:
    name: Timer Ausgabeleistung  
    mode: box
    min: 80
    max: 800
    step: 1
  b2500_dod:
    name: DOD max Entladetiefe  
    mode: box
    min: 0
    max: 100
    step: 1

input_button:
  b2500_timer_status_setzen:
    name: Timer ein/ausschalten
  zeit_setzen:
    name: B2500 Zeit setzen    
  b2500_leistung_setzen:
    name: B2500 Leistung setzen
  b2500_selbstanpassung:
    name: B2500 auf Selbstanpassung stellen
