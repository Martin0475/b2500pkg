views:
  - cards:
      - type: conditional
        conditions:
          - condition: state
            entity: input_text.b01_mac
            state_not: '0'
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: CD16 Infos für B01
              heading_style: subtitle
            - type: markdown
              text_only: true
              content: >-
                {% set c16 = state_attr('sensor.b2500_cache_01', 'cd16') or {}
                %}
                  {% set c01 = state_attr('sensor.b2500_cache_01', 'cd01') or {} %}

                  {% set p1 = c01.get('p1', -1) | int(-1) %}
                  {% set p2 = c01.get('p2', -1) | int(-1) %}
                  {% set o1 = c01.get('o1', 0) | int(0) %}
                  {% set o2 = c01.get('o2', 0) | int(0) %}

                  {% set w1 = c16.get('w1', 0) | float(0) %}
                  {% set w2 = c16.get('w2', 0) | float(0) %}
                  {% set g1 = c16.get('g1', 0) | float(0) %}
                  {% set g2 = c16.get('g2', 0) | float(0) %}

                  {% set bb = c16.get('bb', 0) | float(0) %}
                  {% set bv = c16.get('bv', 0) | float(0) / 1000 %}
                  {% set bc = c16.get('bc', 0) | float(0) / 1000 %}

                  {% set l0 = c01.get('l0', 0) | int(0) %}
                  {% set entladen = (l0 % 2) == 1 %}
                  {% set laden = ((l0 // 2) % 2) == 1 %}

                  | | Status | Spannung | Strom | Leistung |
                  |:--|:--:|--:|--:|--:|
                  | **PV1** | {% if p1 == 0 %}⚫ Aus{% elif p1 == 1 %}🟢 Aktiv{% elif p1 == 2 %}🔵 PV{% else %}❓ N/A{% endif %} | {{ '%.2f' | format(c16.get('m1', 0) | float(0) / 1000) }} V | {{ '%.2f' | format(c16.get('c1', 0) | float(0) / 1000) }} A | **{{ w1 | round(0) | int }} W** |
                  | **PV2** | {% if p2 == 0 %}⚫ Aus{% elif p2 == 1 %}🟢 Aktiv{% elif p2 == 2 %}🔵 PV{% else %}❓ N/A{% endif %} | {{ '%.2f' | format(c16.get('m2', 0) | float(0) / 1000) }} V | {{ '%.2f' | format(c16.get('c2', 0) | float(0) / 1000) }} A | **{{ w2 | round(0) | int }} W** |
                  | **Akku** | {% if laden %}🟢 Laden{% elif entladen %}🔵 Entladen{% else %}⚪ Bereit{% endif %} | {{ '%.2f' | format(bv) }} V | {{ '%.2f' | format(bc) }} A | **{{ bb | round(0) | int }} W** |
                  | **OUT1** | {{ '🟢 Aktiv' if o1 == 1 else '⚫ Aus' }} | {{ '%.2f' | format(c16.get('i1', 0) | float(0) / 1000) }} V | {{ '%.2f' | format(c16.get('c3', 0) | float(0) / 1000) }} A | **{{ g1 | round(0) | int }} W** |
                  | **OUT2** | {{ '🟢 Aktiv' if o2 == 1 else '⚫ Aus' }} | {{ '%.2f' | format(c16.get('i2', 0) | float(0) / 1000) }} V | {{ '%.2f' | format(c16.get('c4', 0) | float(0) / 1000) }} A | **{{ g2 | round(0) | int }} W** |

                  **PV Gesamt:** {{ (w1 + w2) | round(0) | int }} W &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; **Output Gesamt:** {{ (g1 + g2) | round(0) | int }} W
            - type: horizontal-stack
              cards:
                - type: vertical-stack
                  cards:
                    - type: gauge
                      entity: sensor.b2500_01_pe
                      name: Batterie SOC
                      min: 0
                      max: 100
                      needle: true
                      severity:
                        red: 0
                        yellow: 20
                        green: 50
                      tap_action:
                        action: perform-action
                        perform_action: script.b2500pkg_worker_sequence
                        data:
                          worker: script.b2500_01_worker
                          payloads:
                            - cd=16
                            - cd=01
                            - cd=13
                            - cd=21
                      hold_action:
                        action: perform-action
                        perform_action: script.b2500_01_worker
                        data:
                          payload: cd=30
                          followup_payload: ''
                          no_check: true
                          expected_answer: {}
                    - type: markdown
                      content: >
                        {% set c21 = state_attr('sensor.b2500_cache_01', 'cd21')
                        or {} %}

                        {% set charge = c21.get('cf', 0) | float(0) / 3600000 %}

                        {% set discharge = c21.get('df', 0) | float(0) / 3600000
                        %}

                        <center>

                        <small>

                        <b>Kalibrierung</b><br><br>

                        <b>Charge</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>Discharge</b><br>

                        {{ '%.3f' | format(charge) }} Ah

                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                        {{ '%.3f' | format(discharge) }} Ah

                        </small>

                        </center>
                      text_only: true
                - type: markdown
                  text_only: true
                  content: >+
                    {% set c16 = state_attr('sensor.b2500_cache_01', 'cd16') or
                    {} %}

                    {% set c01 = state_attr('sensor.b2500_cache_01', 'cd01') or
                    {} %}

                    {% set c13 = state_attr('sensor.b2500_cache_01', 'cd13') or
                    {} %}

                    {% set leistung = c16.get('bb', 0) | float(0) %}

                    {% set spannung = c16.get('bv', 0) | float(0) / 1000 %}

                    {% set strom = c16.get('bc', 0) | float(0) / 1000 %}

                    {% set dod_wert = c01.get('do', 0) | int(0) %}

                    {% set keys = [
                      'a0','a1','a2','a3','a4','a5','a6',
                      'a7','a8','a9','aa','ab','ac','ad'
                    ] %}

                    {% set ns = namespace(
                      min_v=999999,
                      min_i=0,
                      max_v=0,
                      max_i=0,
                      count=0
                    ) %}

                    {% for key in keys %}
                      {% set v = c13.get(key, 0) | float(0) %}

                      {% if v > 0 %}
                        {% set ns.count = ns.count + 1 %}

                        {% if v < ns.min_v %}
                          {% set ns.min_v = v %}
                          {% set ns.min_i = loop.index %}
                        {% endif %}

                        {% if v > ns.max_v %}
                          {% set ns.max_v = v %}
                          {% set ns.max_i = loop.index %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}

                    {% set l0 = c01.get('l0', 0) | int(0) %}

                    {% set entladen = (l0 % 2) == 1 %}

                    {% set laden = ((l0 // 2) % 2) == 1 %}

                    {% set dod = ((l0 // 4) % 2) == 1 %}

                    {% set uv = ((l0 // 8) % 2) == 1 %}

                    ## Akku

                    **DOD:** {{ dod_wert }} %  

                    {% if ns.count > 0 %}

                    **Min. Zelle:** Z{{ '%02d' | format(ns.min_i) }} · {{
                    ns.min_v | round(0) | int }} mV  

                    **Max. Zelle:** Z{{ '%02d' | format(ns.max_i) }} · {{
                    ns.max_v | round(0) | int }} mV  

                    **Zelldrift:** {{ (ns.max_v - ns.min_v) | round(0) | int }}
                    mV

                    {% else %}

                    **Min. Zelle:** –  

                    **Max. Zelle:** –  

                    **Zelldrift:** –

                    {% endif %}

            - type: markdown
              content: '---'
              text_only: true
