        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Timer Status
            badges: []
          - type: markdown
            title: B2500 Timer
            entity_id:
              - input_text.b01_mac
              - input_text.b02_mac
              - input_text.b03_mac
              - input_text.b04_mac
              - input_text.b05_mac
              - input_text.b06_mac
              - input_text.b07_mac
              - input_text.b08_mac
              - input_text.b09_mac
              - sensor.b2500_cache_01
              - sensor.b2500_cache_02
              - sensor.b2500_cache_03
              - sensor.b2500_cache_04
              - sensor.b2500_cache_05
              - sensor.b2500_cache_06
              - sensor.b2500_cache_07
              - sensor.b2500_cache_08
              - sensor.b2500_cache_09
            content: |
              {% for nr in range(1, 10) %}
                {% set n = '%02d' | format(nr) %}
                {% set mac = states('input_text.b' ~ n ~ '_mac') %}
                {% set cache = 'sensor.b2500_cache_' ~ n %}
                {% set c = state_attr(cache, 'cd01') or {} %}

                {% if mac not in ['0', '', 'unknown', 'unavailable', 'none'] %}

              ### 🔋 B{{ n }}

              {% if c %}

                {% set md = c.get('md', '-1') | int(-1) %}
                {% set cs = c.get('cs', '-1') | int(-1) %}
                {% set soc = c.get('pe', '-') %}
                {% set dod = c.get('do', '-') %}

                {% if md == 1 %}
                  {% set modus = '🧠 Selbstanpassung' %}
                {% elif md == 0 %}
                  {% set modus = '⏱️ Timer' %}
                {% else %}
                  {% set modus = '❔ Unbekannt' %}
                {% endif %}

                {% if cs == 1 %}
                  {% set ladeart = 'Laden vor Entladen' %}
                {% elif cs == 0 %}
                  {% set ladeart = 'Laden + Entladen' %}
                {% else %}
                  {% set ladeart = 'Unbekannt' %}
                {% endif %}

              **{{ modus }}**  
              🔋 SOC `{{ soc }} %` · DOD `{{ dod }} %`  
              ⚙️ {{ ladeart }}

                {% set rows = namespace(v=[]) %}

                {% for t in range(1, 6) %}
                  {% set aktiv = c.get('d' ~ t, '0') | int(0) %}
                  {% set start_raw = c.get('e' ~ t, '0:0') %}
                  {% set ende_raw = c.get('f' ~ t, '0:0') %}

                  {% set sp = start_raw.split(':') %}
                  {% set ep = ende_raw.split(':') %}

                  {% if sp | count == 2 %}
                    {% set start = '%2d:%02d' | format(sp[0] | int(0), sp[1] | int(0)) %}
                  {% else %}
                    {% set start = '--:--' %}
                  {% endif %}

                  {% if ep | count == 2 %}
                    {% set ende = '%2d:%02d' | format(ep[0] | int(0), ep[1] | int(0)) %}
                  {% else %}
                    {% set ende = '--:--' %}
                  {% endif %}

                  {% set leistung = '%4d W' | format(c.get('h' ~ t, 0) | int(0)) %}
                  {% set status = '🟢 Ein' if aktiv == 1 else '⚫ Aus' %}

                  {% set rows.v = rows.v + [
                    '| **' ~ t ~ '** | ' ~ status ~
                    ' | `' ~ start ~
                    '` | `' ~ ende ~
                    '` | `' ~ leistung ~ '` |'
                  ] %}
                {% endfor %}

              | Timer | Status | Beginn | Ende | Leistung |
              |:--:|:--:|:--:|:--:|--:|
              {{ rows.v | join('\n') }}

              {% else %}

              🟡 **Keine Daten im Cache**

              {% endif %}

              ---

                {% endif %}
              {% endfor %}
        column_span: 2
